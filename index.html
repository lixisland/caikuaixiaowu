           切到那一套、调游戏原生的 paintFace 上色 / 挂图、
           随即切回，所以果冻就是棋盘上的果冻、图片套就是
           原图，和棋盘里看到的一模一样。点任意一张卡片立即
           换上那套：applyTheme 同步换三个游戏与翻牌牌面，
           当前对局不重置；左上角 ← 关页回到游戏 */
        var dressPage = document.getElementById("dressPage");
        var dressList = document.getElementById("dressList");
        var dressCardsBuilt = false;
        function paintFaceAs(key, face, b){
          var prev = curTheme;
          curTheme = key;
          paintFace(face, b);
          curTheme = prev;
        }
        /* 每张卡片自带它那一套的质感上下文类（与棋盘的
           .jelly / .glassimg / .eggimg / .frogimg 对应），上面
           CSS 里补了 .dress-card 选择器的三条规则因此生效 */
        function themeCtxClass(key){
          if(THEMES[key].jelly) return "jelly";
          if(key === "glass") return "glassimg";
          if(key === "egg") return "eggimg";
          if(key === "frog") return "frogimg";
          return "";
        }
        function buildDressCards(){
          if(dressCardsBuilt) return;
          dressCardsBuilt = true;
          Object.keys(THEMES).forEach(function(key){
            var t = THEMES[key];
            ensureThemeImgs(key);
            var card = document.createElement("button");
            card.type = "button";
            var ctx = themeCtxClass(key);
            card.className = "dress-card" + (ctx ? " " + ctx : "");
            card.setAttribute("data-theme", key);
            card.setAttribute("aria-pressed", String(key === curTheme));
            var head = document.createElement("span");
            head.className = "dress-card-head";
            var nm = document.createElement("span");
            nm.className = "dress-name";
            nm.textContent = t.name;
            var using = document.createElement("span");
            using.className = "dress-using";
            using.textContent = "使用中";
            head.appendChild(nm);
            head.appendChild(using);
            card.appendChild(head);
            var row = document.createElement("span");
            row.className = "dress-row";
            for(var i = 0; i < 9; i++){
              var cell = document.createElement("span");
              cell.className = "tile";
              var face = document.createElement("span");
              face.className = "face";
              cell.appendChild(face);
              row.appendChild(cell);
              /* 顺序与游戏的颜色槽位一致：粉 / 橙 / 黄 / 绿 /
                 青 / 蓝 / 紫 / 第 8 块，最后一个是彩虹块 */
              paintFaceAs(key, face, { color: i === 8 ? -1 : i });
            }
            card.appendChild(row);
            card.addEventListener("click", function(){
              if(curTheme !== key){ applyTheme(key); sndSelect(); }
            });
            dressList.appendChild(card);
          });
        }
        function syncDressCards(){
          dressList.querySelectorAll(".dress-card").forEach(function(c){
            c.setAttribute("aria-pressed", String(c.getAttribute("data-theme") === curTheme));
          });
        }
        function openDressPage(){
          buildDressCards();
          syncDressCards();
          dressPage.hidden = false;
        }
        document.getElementById("dressBackBtn").addEventListener("click", function(){
          dressPage.hidden = true;
        });

        function buildSolved(cfg){
          var arr = [];
          for(var idx=0; idx<cfg.cols*cfg.rows; idx++){
            var col = idx % cfg.cols;
            arr.push(col % cfg.colors);
          }
          /* the single rainbow block replaces one random cell; remember
             which colour it replaced — the extra overflow block carries
             that colour, so the board stays solvable with the rainbow
             ending up as the final overflow block */
          var cells = shuffleArr(arr.map(function(_,i){ return i; }));
          var replaced = arr[cells[0]];
          for(var w=0; w<cfg.wild; w++){ arr[cells[w]] = -1; }
          return { cells: arr, replaced: replaced }; /* cells = cellColor[cellIndex] */
        }

        function scramble(cellColor, cfg){
          return shuffleArr(cellColor.slice());
        }

        /* a column is complete only when every block in it is the same
           ordinary colour — the rainbow block is NOT a wildcard: a column
           containing it never counts as complete and never locks */
        function columnComplete(cellColor, cfg, col){
          var first = cellColor[col];
          if(first === -1 || first === undefined) return false;
          for(var r=1;r<cfg.rows;r++){
            if(cellColor[r*cfg.cols + col] !== first) return false;
          }
          return true;
        }

        /* lone-block sink rule (generalises the old rainbow-only rule):
           if a column's blocks are all one single colour except for ONE
           lone block of a different colour — any ordinary colour or the
           rainbow block both count — that lone block drops straight to
           the last row (the bottom of the column) and the blocks below
           it shift up one row to fill the gap, so the next insert into
           this column squeezes the lone block out first, into the
           overflow spot. The column still does NOT count as complete
           while the lone block is in it: completion still requires every
           block to be the same ordinary colour (see columnComplete).
           Returns true when any column changed. Positions are committed
           immediately; the caller re-layouts so the move slides. */
        function sinkLoneBlocks(){
          var cols = G.cols, rows = G.rows, moved = false;
          if(rows < 2) return false;
          var cellToId = new Array(cols * rows);
          G.blocks.forEach(function(b){ if(G.pos[b.id] >= 0) cellToId[G.pos[b.id]] = b.id; });
          for(var c=0;c<cols;c++){
            var colIds = [];
            var bad = false;
            for(var r=0;r<rows;r++){
              var id = cellToId[r*cols + c];
              if(id === undefined || !G.blocks[id]){ bad = true; break; }
              colIds.push(id);
            }
            if(bad) continue;
            /* count colours in this column: the rule fires only when one
               colour appears rows-1 times and exactly one other block
               (of any other single colour) appears once */
            var counts = {};
            for(var r2=0;r2<rows;r2++){
              var col2 = G.blocks[colIds[r2]].color;
              counts[col2] = (counts[col2] || 0) + 1;
            }
            var majority = null, loneColor = null, shapeOk = false;
            var keys = Object.keys(counts);
            if(keys.length === 2){
              for(var k=0;k<keys.length;k++){
                if(counts[keys[k]] === rows - 1){ majority = keys[k]; shapeOk = true; }
                else if(counts[keys[k]] === 1){ loneColor = keys[k]; }
              }
            }
            if(!shapeOk || loneColor === null || majority === null) continue;
            var rIdx = -1;
            for(var r3=0;r3<rows;r3++){
              if(String(G.blocks[colIds[r3]].color) !== String(majority)){ rIdx = r3; break; }
            }
            if(rIdx === -1 || rIdx === rows - 1) continue;
            for(var r4=rIdx;r4<rows-1;r4++) G.pos[colIds[r4+1]] = r4*cols + c;
            G.pos[colIds[rIdx]] = (rows-1)*cols + c;
            moved = true;
          }
          return moved;
        }
        /* back-compat alias: older call sites referred to the rainbow case */
        function sinkRainbows(){ return sinkLoneBlocks(); }
        function countComplete(cellColor, cfg){
          var n = 0;
          for(var c=0;c<cfg.cols;c++){ if(columnComplete(cellColor, cfg, c)) n++; }
          return n;
        }

        function cellColorNow(){
          var arr = new Array(G.cols*G.rows);
          G.blocks.forEach(function(b){ if(G.pos[b.id] >= 0) arr[G.pos[b.id]] = b.color; });
          return arr;
        }

        function loadLevel(i){
          if(G.animTimer){ clearTimeout(G.animTimer); G.animTimer = null; }
          G.anim = false;
          G.level = i;
          var cfg = LEVELS[i];
          G.cols = cfg.cols; G.rows = cfg.rows;
          G.moves = 0; G.won = false;
          trayLevels.querySelectorAll(".opt").forEach(function(b, bi){
            b.setAttribute("aria-pressed", String(bi === i));
          });

          /* pool = the solved board plus one extra block; the extra one
             starts in the overflow slot below the board and carries the
             colour the rainbow block replaced, keeping the level solvable
             with the rainbow as the final overflow block */
          var solved = buildSolved(cfg);
          var pool = solved.cells;
          pool.push(solved.replaced);
          var cellColor = null, overflowColor = 0, guard = 0;
          do {
            var shuffled = scramble(pool.slice(), cfg);
            cellColor = shuffled.slice(0, cfg.cols * cfg.rows);
            overflowColor = shuffled[cfg.cols * cfg.rows];
            guard++;
          } while(countComplete(cellColor, cfg) > Math.floor(cfg.cols/2) && guard < 12);

          var totalCells = cfg.cols * cfg.rows;
          G.blocks = cellColor.map(function(color, idx){ return { id: idx, color: color }; });
          G.blocks.push({ id: totalCells, color: overflowColor });
          G.pos = cellColor.map(function(_, idx){ return idx; });
          G.pos.push(-1);
          G.overflowId = totalCells;
          G.elById = {};

          boardEl.innerHTML = "";
          markersEl.innerHTML = "";
          G.completeCols = [];
          G.colState = [];
          for(var c=0;c<cfg.cols;c++){
            /* the dot above row 1 is the insert target for its column;
               on a locked column the same tap unlocks it instead */
            var m = document.createElement("button");
            m.type = "button"; m.className = "marker";
            m.setAttribute("aria-label", "把溢出块放入第 " + (c+1) + " 列");
            m.innerHTML = "<span class='pip'>✓</span>";
            (function(col){
              m.addEventListener("click", function(){
                ac();
                if(G.colState[col] === "locked"){
                  G.colState[col] = "unlocked";
                  applyLockedClasses();
                  sndSelect();
                  return;
                }
                insertIntoColumn(col);
              });
            })(c);
            markersEl.appendChild(m);
            G.completeCols.push(false);
            G.colState.push("open");
          }

          G.blocks.forEach(function(b){
            var el = document.createElement("div");
            el.className = "tile"; el.setAttribute("data-id", b.id);
            el.setAttribute("aria-label", b.color === -1 ? "彩虹块" : PALETTE[b.color].name + "色块");
            var face = document.createElement("div");
            face.className = "face";
            paintFace(face, b);
            el.appendChild(face);
            boardEl.appendChild(el);
            G.elById[b.id] = el;
          });
          layoutTiles(false);
          updateHUD();
          document.getElementById("winBanner").classList.remove("show");
          refreshMarkers(true);
          applyLockedClasses();
          /* opening deal: run the lone-block sink check once the board
             is fitted, sliding any lone different-coloured block to the
             bottom of its column if the rest of that column is already
             one colour */
          requestAnimationFrame(function(){
            fitBoard();
            if(sinkLoneBlocks()) layoutTiles(true);
          });
        }

        function applyLockedClasses(){
          G.blocks.forEach(function(b){
            if(G.pos[b.id] < 0) return;
            var col = G.pos[b.id] % G.cols;
            G.elById[b.id].classList.toggle("locked", G.colState[col] === "locked");
          });
        }

        /* every tile's translate() target in board coordinates: a board
           cell, or — for the overflow block — centred below the last row,
           frameless, with HAND_GAP of space above it */
        function tileXY(b){
          var g = G.geom;
          var idx = G.pos[b.id];
          if(idx >= 0) return [ (idx % G.cols) * g.cellW, Math.floor(idx / G.cols) * g.cellH ];
          return [ (g.stackW - g.cellW) / 2, g.boardH + HAND_GAP ];
        }
        function layoutTiles(animate){
          if(!G.geom) return;
          if(!animate) boardEl.classList.add("no-anim");
          G.blocks.forEach(function(b){
            var el = G.elById[b.id];
            var xy = tileXY(b);
            el.style.width = G.geom.cellW + "px";
            el.style.height = G.geom.cellH + "px";
            el.style.transform = "translate(" + xy[0] + "px," + xy[1] + "px)";
          });
          if(!animate){ void boardEl.offsetWidth; boardEl.classList.remove("no-anim"); }
        }

        function updateHUD(){}

        function refreshMarkers(silent){
          var now = cellColorNow(), cfg = LEVELS[G.level];
          for(var c=0;c<G.cols;c++){
            var done = columnComplete(now, cfg, c);
            var marker = markersEl.children[c];
            if(done && !G.completeCols[c]){
              if(!silent) sndColumn();
              if(G.colState[c] === "open") G.colState[c] = "locked";
            }
            if(!done && G.colState[c] !== "locked") G.colState[c] = "open";
            G.completeCols[c] = done;
            marker.classList.toggle("done", done);
          }
        }

        /* the one and only move, in two animated phases:
           1) the overflow block flies up to the entry point above row 1 —
              centred on this column's dot;
           2) it drops into row 1 while the whole column slides down one
              row (transform transition) and the bottom block slides out
              to the overflow spot below the board, becoming the next block.
           No click/press feedback animation: the tap itself does nothing
           visual, only the move animates (plus the insert/landing sounds). */
        function insertIntoColumn(col){
          if(G.won || G.anim) return;
          if(col < 0 || col >= G.cols) return;
          if(G.colState[col] === "locked") return;
          var cols = G.cols, rows = G.rows;
          var cellToId = new Array(cols * rows);
          G.blocks.forEach(function(b){ if(G.pos[b.id] >= 0) cellToId[G.pos[b.id]] = b.id; });
          var colIds = [];
          for(var r=0;r<rows;r++) colIds.push(cellToId[r*cols + col]);
          var outId = colIds[rows-1];   /* bottom block -> overflow spot */
          var inId = G.overflowId;      /* overflow block -> top of column */
          var inEl = G.elById[inId];

          function commit(){
            for(var r2=rows-1;r2>=1;r2--) G.pos[colIds[r2-1]] = r2*cols + col;
            G.pos[outId] = -1;
            G.pos[inId] = col;
            G.overflowId = outId;
            inEl.classList.remove("flying");
            layoutTiles(true);
            sndInsert();
            G.moves++;
          }
          function finish(){
            sndLand();
            /* lone-block sink: if a column now holds exactly one block
               of a different colour and every other block in it is one
               single colour, that lone block slides straight to the
               bottom row before anything is scored — the same check runs
               wherever the lone block came from, including when it was
               just inserted from the overflow spot */
            if(sinkLoneBlocks()){
              layoutTiles(true);
              G.animTimer = setTimeout(function(){
                G.anim = false; G.animTimer = null;
                refreshMarkers(false);
                applyLockedClasses();
                checkWin();
              }, reduced ? 0 : 300);
              return;
            }
            G.anim = false; G.animTimer = null;
            refreshMarkers(false);
            applyLockedClasses();
            checkWin();
          }
          if(reduced || !G.geom){ commit(); finish(); return; }
          G.anim = true;
          inEl.classList.add("flying");
          inEl.style.transform = "translate(" + (col * G.geom.cellW) + "px," +
            (-MARKER_H / 2 - G.geom.cellH / 2) + "px)";
          G.animTimer = setTimeout(function(){
            commit();
            G.animTimer = setTimeout(finish, 300);
          }, 210);
        }

        function checkWin(){
          var now = cellColorNow(), cfg = LEVELS[G.level];
          if(countComplete(now, cfg) === cfg.cols){
            G.won = true;
            sndWin(); confetti();
            document.getElementById("winTitle").textContent = LEVELS[G.level].name + "，过关啦";
            document.getElementById("winDetail").textContent = "用了 " + G.moves + " 步";
            document.getElementById("winBanner").classList.add("show");
            requestAnimationFrame(fitBoard);
          }
        }

        document.getElementById("nextLevelBtn").addEventListener("click", function(){
          loadLevel(G.level);
        });

        /* ---- tap interaction ----
           The only tap targets are the dots above row 1 (the marker
           buttons built in loadLevel): tapping one inserts the overflow
           block into that column. The blocks themselves are not tappable.
           No dragging, no swapping. */
        boardEl.addEventListener("contextmenu", function(e){ e.preventDefault(); });

        loadLevel(0);
        renderLevelTray();

        /* ================= pile game （彩块堆消） ================= */
        var pileArea = document.getElementById("pileArea");
        var pileSlotbar = document.getElementById("pileSlotbar");
        var pileTrayLayer = document.getElementById("pileTrayLayer");
        var pileBanner = document.getElementById("pileBanner");
        var pileTools = document.getElementById("pileTools");

        /* deterministic RNG so a level deals the same heap every time
           it is opened; replaying bumps the attempt and re-seeds */
        function mulberry(seed){
          var a = seed >>> 0;
          return function(){
            a = (a + 0x6D2B79F5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function pileTileSize(){
          var W = pileArea.clientWidth, H = pileArea.clientHeight;
          /* 所有关同一套块尺寸，挑战堆也不例外：900 块就靠在
             同样的框里累计重叠、叠得更深，不靠把块做小 */
          var tw = Math.max(46, Math.min(104, W * 0.20));
          return { tw:tw, th:tw * 1.15, W:W, H:H };
        }

        function loadPileLevel(i){
          P.level = i; P.attempt = 0;
          dealPile();
          renderLevelTray();
        }

        function dealPile(){
          var cfg = PILE_LEVELS[P.level];
          P.slots = cfg.slots;
          P.tray = []; P.trayEls = {}; P.traySeq = [];
          P.busy = false; P.over = false; P.triples = 0; P.dealt = true;
          P.dealNonce++;
          /* 道具组只属于挑战关：本关亮出来，并把三个道具复位
             （每局各一次）；其它关藏起来。它在顶栏里，藏与露都
             不动面板布局，堆框大小位置分毫不变 */
          pileTools.hidden = !cfg.tools;
          P.tools = { out:false, combine:false, shuffle:false };
          syncToolBtns();
          pileTrayLayer.innerHTML = "";
          pileArea.innerHTML = "";
          pileBanner.classList.remove("show");
          /* slot cells (visual only; the tray tiles float above them
             in the tray layer and slide between positions) */
          pileSlotbar.querySelectorAll(".slot").forEach(function(s){ s.remove(); });
          for(var s2=0;s2<P.slots;s2++){
            var slot = document.createElement("div");
            slot.className = "slot";
            pileSlotbar.insertBefore(slot, pileTrayLayer);
          }
          /* guaranteed solvable, dealt backwards from a solution:
             1) lay out a solution order — every triple as a run of
                three of a colour, the triples themselves shuffled;
             2) scatter the colours with many random adjacent swaps,
                keeping only a swap a tray simulation proves safe:
                walk the order feeding blocks into the tray (same
                colour groups together, three clear), and never let
                the uncleared leftovers (each colour's count mod 3,
                summed) exceed slots-1, so following this order can
                never fill the tray;
             3) the heap is then stacked in reverse (in the block
                creation below): the last block of the order is placed
                first with the smallest z, the first block last with
                the largest z — so when the order is followed, any
                block covering the next one has already been taken */
          var rand = mulberry(4200 + P.level * 977 + P.attempt * 131);
          var groups = [];
          for(var c=0;c<cfg.colors;c++){
            /* 挑战关的组数按色分配（37 / 38 组交错，凑满 300 组），
               其余关每色组数相同 */
            var tc = cfg.triplesList ? cfg.triplesList[c] : cfg.triples;
            for(var t=0;t<tc;t++) groups.push(c);
          }
          for(var i=groups.length-1;i>0;i--){
            var j = Math.floor(rand() * (i + 1));
            var tmp = groups[i]; groups[i] = groups[j]; groups[j] = tmp;
          }
          var seq = [];
          groups.forEach(function(c){ seq.push(c, c, c); });
          function seqFits(s){
            var counts = {}, pending = 0;
            for(var k=0;k<s.length;k++){
              var before = counts[s[k]] || 0;
              counts[s[k]] = before + 1;
              pending += (before % 3 === 2) ? -2 : 1;
              if(pending > cfg.slots - 1) return false;
            }
            return true;
          }
          var swapTries = seq.length * 4;
          for(var sw=0; sw<swapTries; sw++){
            var p = Math.floor(rand() * (seq.length - 1));
            if(seq[p] === seq[p + 1]) continue;
            var t3 = seq[p]; seq[p] = seq[p + 1]; seq[p + 1] = t3;
            if(!seqFits(seq)){
              t3 = seq[p]; seq[p] = seq[p + 1]; seq[p + 1] = t3;
            }
          }
          var bag = seq;
          /* scattered positions: one block per grid cell in shuffled
             order as a loose starting point, then jittered across the
             whole cell and pushed up to half a cell beyond it, so
             blocks spill over their neighbours' ground and the heap
             looks tossed rather than laid out; tilts vary widely too
             (about ±30°) so no two blocks sit at quite the same angle.
             The stacking test measures each block's coloured shape at
             its real rotation, so the messier angles stay judged
             correctly */
          var n = bag.length;
          /* 所有关同一套分布疏密，挑战关也不加密网格：900 块
             照常撒满全框，重叠之深全来自块数本身 */
          var gc = Math.max(2, Math.ceil(Math.sqrt(n * 1.35)));
          var gr = Math.ceil(n / gc);
          var cells = [];
          for(var k=0;k<gc*gr;k++) cells.push(k);
          for(var i2=cells.length-1;i2>0;i2--){
            var j2 = Math.floor(rand() * (i2 + 1));
            var t2 = cells[i2]; cells[i2] = cells[j2]; cells[j2] = t2;
          }
          P.blocks = bag.map(function(color, idx){
            var cell = cells[idx];
            var cx = cell % gc, cy = Math.floor(cell / gc);
            var b = {
              id: idx, color: color,
              fx: Math.min(1, Math.max(0, (cx + rand() + (rand() - 0.5) * 0.9) / gc)),
              fy: Math.min(1, Math.max(0, (cy + rand() + (rand() - 0.5) * 0.9) / gr)),
              rot: (rand() - 0.5) * 60,
              /* reverse stacking: block idx of the solution order
                 gets z = n-1-idx, so order position 0 sits on top */
              z: n - 1 - idx, gone: false, exposed: false, el: null
            };
            var el = document.createElement("div");
            el.className = "ptile";
            el.setAttribute("role", "button");
            el.setAttribute("data-color", color);
            el.setAttribute("aria-label", PALETTE[color].name + "色块");
            var edge = document.createElement("div");
            edge.className = "edge";
            el.appendChild(edge);
            var face = document.createElement("div");
            face.className = "face";
            el.appendChild(face);
            paintPileTile(el, b);
            (function(block){
              el.addEventListener("click", function(){ onPileTap(block); });
            })(b);
            b.el = el;
            pileArea.appendChild(el);
            return b;
          });
          /* the built-in solution order is simply the bag order:
             block ids ascend along it (kept for the tools and for
             verification; gameplay itself never reads it) */
          P.solution = P.blocks.map(function(b){ return b.id; });
          layoutPile(false);
          updatePileHUD();
        }

        function pileRect(b){
          var g = P.geom;
          /* containment: a block's position maps its CENTRE into the
             range where the block's whole rotated bounding box stays
             inside the pile area — rotation swings the corners well
             outside the unrotated element box (that is how blocks
             used to poke past the frame, the bottom edge worst of
             all). The box measured is the element grown 3px on every
             side, which also covers the thickness edge hanging below
             the element and leaves a small safety margin */
          var rot = (b.rot || 0) * Math.PI / 180;
          var rc = Math.abs(Math.cos(rot)), rs = Math.abs(Math.sin(rot));
          var bw = g.tw + 6, bh = g.th + 6;
          var hw = (bw * rc + bh * rs) / 2, hh = (bw * rs + bh * rc) / 2;
          var cx = hw + b.fx * Math.max(0, g.W - 2 * hw);
          var cy = hh + b.fy * Math.max(0, g.H - 2 * hh);
          return {
            x: cx - g.tw / 2,
            y: cy - g.th / 2,
            w: g.tw, h: g.th
          };
        }

        /* stacking is judged strictly inside the coloured face itself.
           The old test compared the blocks' whole element boxes, so a
           block counted as covered when only colourless parts touched:
           the tile's transparent padding and border slot, the rounded
           corners, the clear margins and see-through corners of the
           glass / egg cut-outs — and it ignored each block's rotation,
           whose corners swing well outside the unrotated box. Now every
           block contributes only its actual coloured shape, rotated
           exactly as drawn:
           - CSS themes: the face sits 3px of tile padding + the 2px
             border slot inside the element box, corners rounded 16px
           - glass cut-outs: measured from the source images, the opaque
             blob spans about 91% of the tile's width and 94% of its
             height with deeply rounded corners
           - egg cut-outs: the egg artwork (with its soft shadow fringe
             inside the image) spans about 78% × 82% of the tile and
             the egg itself is close to a full ellipse
           Each shape is a convex rounded-rect outline; overlap is
           tested with the separating-axis test, so rotation counts.
           A further 1px shrink means a hairline graze of colour that
           the eye cannot see never blocks a block. A block is exposed
           only when no block above it overlaps its colour at all —
           covered blocks dim and refuse taps. */
        /* 奶蛙家族：每个角色的判定形状按它自己抠图的真实轮廓 —
           角色图以 contain 方式完整显示在方块里，先按各图的宽高比
           算出图在方块内的实际占位，再取抠图不透明部分的外接范围
           （实测约占图面 96%），得到每个角色自己的半宽 / 半高
           （占方块宽 / 高的比例，按普通 8 位的槽位顺序）：
           奶蛙是高瘦的竖形，奶猫、奶狗偏矮宽，其余接近方形 */
        var FROG_POLY = [
          [0.276, 0.451], /* 奶蛙：高瘦 */
          [0.435, 0.422], /* 奶蛋 */
          [0.435, 0.376], /* 小奶蛙 */
          [0.435, 0.440], /* 奶鼠 */
          [0.434, 0.396], /* 奶豆 */
          [0.435, 0.391], /* 奶狗 */
          [0.437, 0.411], /* 奶鸡 */
          [0.437, 0.372]  /* 奶猫：矮宽 */
        ];
        function pileColorPoly(b){
          var r = pileRect(b);
          var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
          var hw, hh, rad;
          if(curTheme === "glass"){ hw = r.w * 0.455; hh = r.h * 0.468; rad = Math.min(hw, hh) * 0.60; }
          else if(curTheme === "egg"){ hw = r.w * 0.39; hh = r.h * 0.407; rad = Math.min(hw, hh) * 0.92; }
          else if(curTheme === "frog"){
            var fp = FROG_POLY[b.color] || [0.435, 0.41];
            hw = r.w * fp[0]; hh = r.h * fp[1];
            rad = Math.min(hw, hh) * 0.5;
          }
          else { hw = r.w / 2 - 5; hh = r.h / 2 - 5; rad = 14; }
          hw = Math.max(4, hw - 1); hh = Math.max(4, hh - 1);
          rad = Math.min(rad, hw, hh);
          var rot = (b.rot || 0) * Math.PI / 180;
          var cos = Math.cos(rot), sin = Math.sin(rot);
          var pts = [];
          var corners = [
            [ hw - rad, -(hh - rad), -90],
            [ hw - rad,   hh - rad,   0],
            [-(hw - rad),  hh - rad,  90],
            [-(hw - rad), -(hh - rad), 180]
          ];
          corners.forEach(function(c){
            for(var s = 0; s <= 3; s++){
              var a = (c[2] + s * 30) * Math.PI / 180;
              var lx = c[0] + rad * Math.cos(a);
              var ly = c[1] + rad * Math.sin(a);
              pts.push({ x: cx + lx * cos - ly * sin, y: cy + lx * sin + ly * cos });
            }
          });
          return pts;
        }
        function polysOverlap(a, b){
          var polys = [a, b];
          for(var p = 0; p < 2; p++){
            var poly = polys[p];
            for(var i = 0; i < poly.length; i++){
              var p1 = poly[i], p2 = poly[(i + 1) % poly.length];
              var ax = -(p2.y - p1.y), ay = p2.x - p1.x;
              var minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
              var j, d;
              for(j = 0; j < a.length; j++){ d = a[j].x * ax + a[j].y * ay; if(d < minA) minA = d; if(d > maxA) maxA = d; }
              for(j = 0; j < b.length; j++){ d = b[j].x * ax + b[j].y * ay; if(d < minB) minB = d; if(d > maxB) maxB = d; }
              if(maxA < minB || maxB < minA) return false;
            }
          }
          return true;
        }
        function computeExposed(){
          if(!P.geom) return;
          var alive = P.blocks.filter(function(b){ return !b.gone; });
          var polys = alive.map(function(b){ return pileColorPoly(b); });
          /* broad phase for the big heaps: each block's bounding
             box goes into a uniform grid, and the exact SAT test
             below only runs on pairs that share a cell. Two blocks
             whose coloured shapes overlap must have intersecting
             boxes, and intersecting boxes always share a cell — so
             every verdict is identical to testing all pairs, just
             without the quadratic blow-up at 900 blocks */
          var boxes = polys.map(function(p){
            var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            p.forEach(function(pt){
              if(pt.x < minX) minX = pt.x;
              if(pt.x > maxX) maxX = pt.x;
              if(pt.y < minY) minY = pt.y;
              if(pt.y > maxY) maxY = pt.y;
            });
            return { minX:minX, minY:minY, maxX:maxX, maxY:maxY };
          });
          var cell = 1;
          boxes.forEach(function(bb){
            cell = Math.max(cell, bb.maxX - bb.minX, bb.maxY - bb.minY);
          });
          function cellRange(bb){
            return [
              Math.floor(bb.minX / cell), Math.floor(bb.maxX / cell),
              Math.floor(bb.minY / cell), Math.floor(bb.maxY / cell)
            ];
          }
          var grid = {};
          boxes.forEach(function(bb, i){
            var r = cellRange(bb);
            for(var gx = r[0]; gx <= r[1]; gx++){
              for(var gy = r[2]; gy <= r[3]; gy++){
                var key = gx + ":" + gy;
                if(!grid[key]) grid[key] = [];
                grid[key].push(i);
              }
            }
          });
          var seen = new Int32Array(alive.length);
          var mark = 0;
          alive.forEach(function(b, bi){
            var exposed = true;
            mark++;
            var r = cellRange(boxes[bi]);
            outer:
            for(var gx = r[0]; gx <= r[1]; gx++){
              for(var gy = r[2]; gy <= r[3]; gy++){
                var list = grid[gx + ":" + gy];
                if(!list) continue;
                for(var li = 0; li < list.length; li++){
                  var i = list[li];
                  if(i === bi || seen[i] === mark) continue;
                  seen[i] = mark;
                  if(alive[i].z <= b.z) continue;
                  if(polysOverlap(polys[bi], polys[i])){ exposed = false; break outer; }
                }
              }
            }
            b.exposed = exposed;
            b.el.classList.toggle("covered", !exposed);
          });
        }

        function layoutPile(animate){
          if(!P.dealt) return;
          if(document.getElementById("panel-pile").classList.contains("on") === false) return;
          if(pileArea.clientWidth <= 0) return;
          P.geom = pileTileSize();
          if(!animate) pileArea.classList.add("no-anim");
          P.blocks.forEach(function(b){
            if(b.gone) return;
            var r = pileRect(b);
            b.el.style.width = r.w + "px";
            b.el.style.height = r.h + "px";
            b.el.style.zIndex = b.z + 1;
            b.el.style.transform = "translate(" + r.x + "px," + r.y + "px) rotate(" + b.rot + "deg)";
          });
          if(!animate){ void pileArea.offsetWidth; pileArea.classList.remove("no-anim"); }
          computeExposed();
          renderTray(false);
        }

        function slotRect(idx){
          var slots = pileSlotbar.querySelectorAll(".slot");
          var layerR = pileTrayLayer.getBoundingClientRect();
          var r = slots[idx].getBoundingClientRect();
          return { x: r.left - layerR.left, y: r.top - layerR.top, w: r.width, h: r.height };
        }

        /* tray tiles are keyed by block id and positioned by their
           index in P.tray, so an insertion next to its colour group
           visibly slides the blocks after it one slot right */
        function renderTray(animate){
          var seen = {};
          P.tray.forEach(function(item, idx){
            seen[item.id] = true;
            var el = P.trayEls[item.id];
            if(!el){
              el = document.createElement("div");
              el.className = "ttile";
              el.setAttribute("data-color", item.color);
              var edge = document.createElement("div");
              edge.className = "edge";
              el.appendChild(edge);
              var face = document.createElement("div");
              face.className = "face";
              el.appendChild(face);
              paintPileTile(el, item);
              pileTrayLayer.appendChild(el);
              P.trayEls[item.id] = el;
              el.style.transition = "none";
            }
            var r = slotRect(idx);
            el.style.width = r.w + "px";
            el.style.height = r.h + "px";
            el.style.transform = "translate(" + r.x + "px," + r.y + "px) scale(1)";
            el.style.opacity = "1";
            if(el.style.transition === "none"){
              void el.offsetWidth;
              el.style.transition = "";
            }
          });
          Object.keys(P.trayEls).forEach(function(id){
            if(!seen[id]){ P.trayEls[id].remove(); delete P.trayEls[id]; }
          });
        }

        function updatePileHUD(){
          var left = P.blocks.filter(function(b){ return !b.gone; }).length;
          document.getElementById("pileLeft").textContent = left;
        }

        /* thickness edge colours for the two image themes: one
           deeper shade per colour slot, matched to each cutout's
           own dominant colour (glass: pink/orange/yellow/green/
           cyan/blue/purple/white; egg: pink/orange/yellow/green/
           purple/grey/cyan/blue — same slot order as their imgs) */
        var PILE_IMG_EDGES = {
          glass:["#C48B97","#C07A38","#B9973A","#6F9E57","#5E9E96","#5E7FA8","#8B76AC","#B3AEA2"],
          egg:["#DDA8B3","#D8985B","#D1B15B","#97B876","#A490C2","#96938E","#77B3AB","#7998BE"]
        };
        function darkenHex(hex, f){
          var rgb = hexToRgb(hex);
          return "rgb(" + Math.round(rgb[0]*f) + "," + Math.round(rgb[1]*f) + "," + Math.round(rgb[2]*f) + ")";
        }
        /* paint one pile/tray tile: its face (shared paintFace) plus
           the thickness edge behind it — macaron reuses its design
           sheet's deeper rim shades, the other CSS themes darken
           the block's own colour, the image themes use the matched
           per-slot shades above */
        function paintPileTile(el, b){
          paintFace(el.querySelector(".face"), b);
          var edge = el.querySelector(".edge");
          if(!edge) return;
          var t = THEMES[curTheme];
          var col;
          if(t.imgTheme) col = (PILE_IMG_EDGES[curTheme] || [])[b.color];
          else if(t.edges) col = t.edges[b.color];
          else col = darkenHex(t.colors[b.color], 0.72);
          edge.style.background = col || "transparent";
        }

        /* repaint every pile and tray face for the current theme —
           called from applyTheme; positions and game state untouched */
        function paintPileFaces(){
          if(!P.dealt) return;
          P.blocks.forEach(function(b){
            if(!b.gone && b.el) paintPileTile(b.el, b);
          });
          P.tray.forEach(function(item){
            var el = P.trayEls[item.id];
            if(el) paintPileTile(el, item);
          });
          /* the coloured shape the stacking test uses differs per
             theme, so a theme switch re-judges which blocks are
             covered — positions and game state stay untouched */
          if(P.geom) computeExposed();
        }

        function onPileTap(b){
          if(P.busy || P.over || b.gone) return;
          ac();
          if(!b.exposed){
            /* buried block: a small shake and a dull thud, nothing moves */
            b.el.classList.remove("shake");
            void b.el.offsetWidth;
            b.el.classList.add("shake");
            sndBlocked();
            return;
          }
          moveToTray(b);
        }

        /* a tapped block goes straight into the tray — no flight
           animation: it leaves the heap at once and its tray tile is
           placed directly in the target slot (renderTray puts new
           tiles in place without a transition, while the tiles after
           the insertion point still slide one slot right) */
        function moveToTray(b){
          P.busy = true;
          /* insertion point: right after the last block of the same
             colour already in the tray, so equal colours always end
             up side by side; a new colour fills in from the left end
             of the free space (the end of the tray) */
          var insertIdx = P.tray.length;
          for(var i=P.tray.length-1;i>=0;i--){
            if(P.tray[i].color === b.color){ insertIdx = i + 1; break; }
          }
          b.gone = true;
          b.el.remove();
          P.tray.splice(insertIdx, 0, { id: b.id, color: b.color });
          P.traySeq.push(b.id);
          renderTray(true);
          computeExposed();
          updatePileHUD();
          sndInsert();
          setTimeout(function(){ resolveTray(); }, reduced ? 0 : 130);
        }

        /* after a block lands: three of a colour sitting together in
           the tray clear out with a pop, then the end checks run */
        function resolveTray(){
          var counts = {};
          P.tray.forEach(function(item){ counts[item.color] = (counts[item.color] || 0) + 1; });
          var hit = null;
          Object.keys(counts).forEach(function(k){ if(counts[k] >= 3) hit = parseInt(k, 10); });
          if(hit === null){ P.busy = false; checkPileEnd(); return; }
          var removed = 0, removedIds = [];
          P.tray = P.tray.filter(function(item){
            if(item.color === hit && removed < 3){
              removed++;
              removedIds.push(item.id);
              var el = P.trayEls[item.id];
              if(el){
                var m = /translate\((-?[\d.]+)px,(-?[\d.]+)px\)/.exec(el.style.transform || "");
                var bx = m ? m[1] : 0, by = m ? m[2] : 0;
                el.style.transform = "translate(" + bx + "px," + by + "px) scale(.15)";
                el.style.opacity = "0";
                (function(node){ setTimeout(function(){ node.remove(); }, 240); })(el);
                delete P.trayEls[item.id];
              }
              return false;
            }
            return true;
          });
          if(removedIds.length){
            P.traySeq = P.traySeq.filter(function(id){ return removedIds.indexOf(id) < 0; });
          }
          P.triples++;
          sndPair();
          updatePileHUD();
          setTimeout(function(){
            renderTray(true);
            P.busy = false;
            checkPileEnd();
          }, reduced ? 0 : 230);
        }

        function checkPileEnd(){
          var left = P.blocks.filter(function(b){ return !b.gone; }).length;
          if(left === 0 && P.tray.length === 0){
            P.over = true;
            sndWin(); confetti();
            document.getElementById("pileBannerTitle").textContent = PILE_LEVELS[P.level].name + "，过关啦";
            document.getElementById("pileBannerDetail").textContent = "一共消除了 " + P.triples + " 组色块";
            document.getElementById("pileAgainBtn").textContent = "再来一次";
            pileBanner.classList.add("show");
            return;
          }
          /* lost when the tray is full with no triple to clear, or the
             heap is empty but the tray still holds unmatchable blocks */
          if(P.tray.length >= P.slots || (left === 0 && P.tray.length > 0)){
            P.over = true;
            sndLose();
            document.getElementById("pileBannerTitle").textContent = "格子满啦";
            document.getElementById("pileBannerDetail").textContent = left > 0
              ? "堆里还剩 " + left + " 块，格子却先满了"
              : "格子里还剩 " + P.tray.length + " 块没能凑齐三个";
            document.getElementById("pileAgainBtn").textContent = "再试一次";
            pileBanner.classList.add("show");
          }
        }

        /* ================= 挑战关道具（移出 / 组合 / 打乱） =================
           只在挑战关亮出来（dealPile 按 cfg.tools 控制道具组的
           hidden），每个道具每局只能用一次：用过后整颗变灰、
           字变淡、再点无效；重开本关（attempt++ 后重新发牌）
           三个道具一起复位。不满足使用条件时点了不消耗次数 —
           所以每个道具都先验条件、再标记已用 */
        var toolWraps = {
          out: document.getElementById("toolOutWrap"),
          combine: document.getElementById("toolCombineWrap"),
          shuffle: document.getElementById("toolShuffleWrap")
        };
        function syncToolBtns(){
          Object.keys(toolWraps).forEach(function(k){
            var w = toolWraps[k];
            if(!w) return;
            var used = !!P.tools[k];
            w.classList.toggle("used", used);
            w.querySelector(".tool-btn").setAttribute("aria-disabled", String(used));
          });
        }

        /* 槽位模拟（从已有槽内计数起算）：照顺序往槽里放块，
           未凑齐的零头总数永不超过 slots-1、且最后正好清空，
           这条顺序就是走得通的。dealPile 里从空槽起算的 seqFits
           是它 start 为空的特例，公式同一套 */
        function seqFitsFrom(s, start, slots){
          var counts = {}, pending = 0, k;
          for(k in start){ counts[k] = start[k]; pending += start[k]; }
          for(var i=0;i<s.length;i++){
            var before = counts[s[i]] || 0;
            counts[s[i]] = before + 1;
            pending += (before % 3 === 2) ? -2 : 1;
            if(pending > slots - 1) return false;
          }
          return pending === 0;
        }

        /* ---- 道具动画共用：飞行块（移出 / 组合） ----
           把一块真块（堆里的 .ptile 或槽里的 .ttile）克隆成挂在
           body 下的飞行块：fixed 定位、视口坐标，飞行途中不受
           堆框 overflow 裁剪；带上当前主题类，.flytile 的 CSS
           把长相补成与真块一致。起点取源块此刻的真实位置 —
           旋转着的堆块用它的布局尺寸、再按包围盒中心对齐，
           不把旋转包围盒当成块身 */
        function makeFlyer(srcEl, rotFrom){
          var fly = srcEl.cloneNode(true);
          fly.removeAttribute("id");
          fly.classList.remove("ptile", "ttile", "covered", "shake", "toolflash");
          fly.classList.add("flytile");
          ["jelly", "glassimg", "eggimg", "frogimg"].forEach(function(c){
            if(pileArea.classList.contains(c)) fly.classList.add(c);
          });
          var r = srcEl.getBoundingClientRect();
          var w = srcEl.offsetWidth || r.width;
          var h = srcEl.offsetHeight || r.height;
          var x = r.left + (r.width - w) / 2;
          var y = r.top + (r.height - h) / 2;
          fly.style.transition = "none";
          fly.style.margin = "0";
          fly.style.opacity = "1";
          fly.style.zIndex = "90";
          fly.style.width = w + "px";
          fly.style.height = h + "px";
          fly.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (rotFrom || 0) + "deg)";
          document.body.appendChild(fly);
          return { el: fly, x: x, y: y, w: w, h: h, rot: rotFrom || 0 };
        }

        /* 沿一道小弧线飞到目标：中点抬到起终点较高处再往上
           一点，尺寸与转角同步插值。pop 为真时收尾缩小淡出
           （组合的成组消散），否则稳稳落到目标尺寸与转角
           （移出的落位）。播完（或保险丝超时）移除飞行块并
           回调一次 */
        function flyArc(f, o, done){
          var mx = (f.x + o.x) / 2;
          var my = Math.min(f.y, o.y) - Math.max(24, Math.abs(o.y - f.y) * 0.22);
          var endT = "translate(" + o.x + "px," + o.y + "px) rotate(" + o.rot + "deg)" + (o.pop ? " scale(.15)" : "");
          var fin = false;
          function end(){
            if(fin) return;
            fin = true;
            f.el.remove();
            if(done) done();
          }
          var anim = null;
          try{
            anim = f.el.animate([
              { transform: "translate(" + f.x + "px," + f.y + "px) rotate(" + f.rot + "deg)", width: f.w + "px", height: f.h + "px", opacity: "1" },
              { transform: "translate(" + mx + "px," + my + "px) rotate(" + ((f.rot + o.rot) / 2) + "deg)", width: ((f.w + o.w) / 2) + "px", height: ((f.h + o.h) / 2) + "px", opacity: "1", offset: 0.55 },
              { transform: endT, width: o.w + "px", height: o.h + "px", opacity: o.pop ? "0" : "1" }
            ], { duration: o.dur, easing: "cubic-bezier(.33,.7,.3,1)", fill: "forwards" });
          }catch(e){ anim = null; }
          if(anim) anim.onfinish = end;
          else { end(); return; }
          setTimeout(end, o.dur + 150);
        }

        /* 移出：槽里最后一块（最后进槽的那块）退回它原来在堆里
           的位置与层级 — fx / fy / rot / z 从发牌起就没动过，
           块一回去，压住关系由 computeExposed 重新判定。槽为空
           时不可用、不消耗 */
        function toolOut(){
          if(P.busy || P.over || P.tools.out) return;
          if(!P.traySeq.length) return;
          var id = P.traySeq[P.traySeq.length - 1];
          var ti = -1, b = null, i;
          for(i=0;i<P.tray.length;i++) if(P.tray[i].id === id){ ti = i; break; }
          if(ti < 0) return;
          for(i=0;i<P.blocks.length;i++) if(P.blocks[i].id === id){ b = P.blocks[i]; break; }
          if(!b) return;
          P.tools.out = true;
          syncToolBtns();
          var nonce = P.dealNonce;
          if(reduced || !P.geom){
            P.tray.splice(ti, 1);
            P.traySeq.pop();
            b.gone = false;
            pileArea.appendChild(b.el);
            if(P.solution.indexOf(id) < 0) P.solution.unshift(id);
            layoutPile(false);
            updatePileHUD();
            sndInsert();
            return;
          }
          /* 动画版：先把槽里那块克隆成飞行块，再把它从槽数据
             里拿走、让其余槽块照常滑动补位；飞行块沿一道小
             弧线飞回它在堆里的原位（原 fx / fy / rot 从没动
             过），落定那一刻才把真块放回去并重判压住关系
             （变暗 / 变亮随之刷新），落位声也在落定那一刻响。
             全程约 440ms，busy 锁住点击 */
          P.busy = true;
          var fly = null;
          if(P.trayEls[id]) fly = makeFlyer(P.trayEls[id], 0);
          P.tray.splice(ti, 1);
          P.traySeq.pop();
          if(P.solution.indexOf(id) < 0) P.solution.unshift(id);
          renderTray(true);
          var pr = pileRect(b);
          var pa = pileArea.getBoundingClientRect();
          function land(){
            if(P.dealNonce !== nonce) return;   /* 飞行中重开了本关：新局自有状态，飞行块已被 flyArc 收走 */
            b.gone = false;
            pileArea.appendChild(b.el);
            layoutPile(false);
            updatePileHUD();
            sndInsert();
            P.busy = false;
          }
          if(fly){
            flyArc(fly, { x: pa.left + pr.x, y: pa.top + pr.y, w: pr.w, h: pr.h, rot: b.rot || 0, dur: 440, pop: false }, land);
          } else {
            land();
          }
        }

        /* 组合：把目标颜色剩下的块（槽里 + 堆里）全部消除。
           目标颜色：槽里有块时取槽里块数最多的颜色，并列取
           最早进槽的那个；槽为空时取堆顶最上面那块露着的块
           的颜色。剩下的总数必是 3 的倍数（总数按组发、已消的
           也按组计），组数照常累计，之后照常判胜负 */
        function toolCombine(){
          if(P.busy || P.over || P.tools.combine) return;
          var target = null;
          if(P.tray.length){
            var counts = {}, colorOf = {}, firstAt = {};
            P.tray.forEach(function(t){
              counts[t.color] = (counts[t.color] || 0) + 1;
              colorOf[t.id] = t.color;
            });
            P.traySeq.forEach(function(id, i){
              var c = colorOf[id];
              if(c !== undefined && firstAt[c] === undefined) firstAt[c] = i;
            });
            Object.keys(counts).forEach(function(k){
              var c = parseInt(k, 10);
              if(target === null || counts[c] > counts[target] ||
                 (counts[c] === counts[target] && firstAt[c] < firstAt[target])) target = c;
            });
          } else {
            var top = null;
            P.blocks.forEach(function(b){
              if(b.gone || !b.exposed) return;
              if(!top || b.z > top.z) top = b;
            });
            if(top) target = top.color;
          }
          if(target === null) return;   /* 没得消：不消耗 */
          var heap = P.blocks.filter(function(b){ return !b.gone && b.color === target; });
          var inTray = P.tray.filter(function(t){ return t.color === target; });
          var total = heap.length + inTray.length;
          if(!total) return;
          P.tools.combine = true;
          syncToolBtns();
          P.busy = true;
          var nonce = P.dealNonce;
          /* 结算（动画播完才走，和 reduced 时的同步收尾共用）：
             目标色从堆与槽里彻底清掉、组数累计、压住关系重判，
             其余槽块滑动补位，之后照常判胜负 */
          function settleCombine(){
            if(P.dealNonce !== nonce) return;   /* 动画中重开了本关：新局自有状态 */
            heap.forEach(function(b){ b.gone = true; b.el.remove(); });
            var trayGone = {};
            inTray.forEach(function(t){
              trayGone[t.id] = true;
              var el = P.trayEls[t.id];
              if(el){ el.remove(); delete P.trayEls[t.id]; }
            });
            P.tray = P.tray.filter(function(t){ return !trayGone[t.id]; });
            P.traySeq = P.traySeq.filter(function(id){ return !trayGone[id]; });
            var colorById = {};
            P.blocks.forEach(function(b){ colorById[b.id] = b.color; });
            P.solution = P.solution.filter(function(id){ return colorById[id] !== target; });
            P.triples += total / 3;
            sndPair();
            computeExposed();
            updatePileHUD();
            renderTray(true);
            setTimeout(function(){
              if(P.dealNonce !== nonce) return;
              P.busy = false;
              checkPileEnd();
            }, reduced ? 0 : 230);
          }
          if(reduced){
            settleCombine();
            return;
          }
          /* 动画：目标色在槽里和堆里的全部块先一起微微放大闪
             一下（.toolflash 约 220ms），随即各自克隆成飞行块、
             真块藏起来，全部同时汇聚飞向堆中心上方一点，收尾
             成组缩小淡出（约 260ms，和槽里凑齐消除的 pop 一个
             收法）；飞完才走上面的结算。全程 busy 锁点击 */
          var flashEls = [];
          heap.forEach(function(b){ flashEls.push(b.el); });
          inTray.forEach(function(t){ if(P.trayEls[t.id]) flashEls.push(P.trayEls[t.id]); });
          flashEls.forEach(function(el){ el.classList.add("toolflash"); });
          setTimeout(function(){
            if(P.dealNonce !== nonce) return;
            flashEls.forEach(function(el){ el.classList.remove("toolflash"); });
            var areaR = pileArea.getBoundingClientRect();
            var cx = areaR.left + areaR.width / 2;
            var cy = areaR.top + areaR.height * 0.30;
            var flyers = [];
            heap.forEach(function(b){
              flyers.push(makeFlyer(b.el, b.rot || 0));
              b.el.style.visibility = "hidden";
            });
            inTray.forEach(function(t){
              var el = P.trayEls[t.id];
              if(!el) return;
              flyers.push(makeFlyer(el, 0));
              el.style.visibility = "hidden";
            });
            if(!flyers.length){ settleCombine(); return; }
            var pending = flyers.length;
            flyers.forEach(function(f){
              flyArc(f, {
                x: cx - f.w / 2, y: cy - f.h / 2, w: f.w, h: f.h,
                rot: 0, dur: 260, pop: true
              }, function(){
                pending--;
                if(pending <= 0) settleCombine();
              });
            });
          }, 220);
        }

        /* 打乱：把堆里剩下的块按当前槽内状态重新生成一局保证
           有解的摆放 — 新顺序从槽里已有的各色计数起算做槽位
           模拟（先补齐槽里的零头，再三连成组，随机相邻交换只
           收模拟证明安全的），位置照常重新随机，层级
           照旧倒序堆放。槽里的块和已消的组数都不动 */
        function toolShuffle(){
          if(P.busy || P.over || P.tools.shuffle) return;
          var alive = P.blocks.filter(function(b){ return !b.gone; });
          if(!alive.length) return;   /* 堆里没块可打乱：不消耗 */
          var cfg = PILE_LEVELS[P.level];
          P.tools.shuffle = true;
          syncToolBtns();
          P.dealNonce++;
          var rand = mulberry(91000 + P.level * 31337 + P.attempt * 131 + P.dealNonce * 104729);
          var start = {};
          P.tray.forEach(function(t){ start[t.color] = (start[t.color] || 0) + 1; });
          var byColor = {};
          alive.forEach(function(b){
            if(!byColor[b.color]) byColor[b.color] = [];
            byColor[b.color].push(b);
          });
          function needOf(c){ return (3 - ((start[c] || 0) % 3)) % 3; }
          var seq = [];
          /* 先补齐槽里的零头：差 1 块凑齐的先补（只会让槽变空），
             差 2 块的后补（先涨一格再清空） */
          var need1 = [], need2 = [];
          Object.keys(byColor).forEach(function(k){
            var c = parseInt(k, 10);
            if(needOf(c) === 1) need1.push(c);
            else if(needOf(c) === 2) need2.push(c);
          });
          need1.forEach(function(c){ seq.push(c); });
          need2.forEach(function(c){ seq.push(c, c); });
          /* 其余的按三连成组、组间洗牌，和发牌时同一套路。
             每色剩下的块数 = 堆里总数 − 补零头的，必是 3 的倍数 */
          var groups = [];
          Object.keys(byColor).forEach(function(k){
            var c = parseInt(k, 10);
            var rest = byColor[c].length - needOf(c);
            for(var t=0;t<rest/3;t++) groups.push(c);
          });
          for(var i=groups.length-1;i>0;i--){
            var j = Math.floor(rand() * (i + 1));
            var tmp = groups[i]; groups[i] = groups[j]; groups[j] = tmp;
          }
          groups.forEach(function(c){ seq.push(c, c, c); });
          /* 随机相邻交换打散，只收槽位模拟证明安全的交换。
             万一当前槽况本身已经无解（零头占满槽又互不相同，
             怎么点都输），补齐顺序也过不了模拟 — 那就照原样
             打乱摆放，不再校验 */
          if(seqFitsFrom(seq, start, cfg.slots)){
            var swapTries = seq.length * 4;
            for(var sw=0; sw<swapTries; sw++){
              var p = Math.floor(rand() * (seq.length - 1));
              if(seq[p] === seq[p + 1]) continue;
              var t3 = seq[p]; seq[p] = seq[p + 1]; seq[p + 1] = t3;
              if(!seqFitsFrom(seq, start, cfg.slots)){
                t3 = seq[p]; seq[p] = seq[p + 1]; seq[p + 1] = t3;
              }
            }
          }
          /* 照新顺序重新摆位：位置重新随机（与发牌同一套全框
             分布），层级倒序 — 顺序里越靠前的块层级越高，照
             顺序拿时压住它的块必定先被拿走 */
          var n = seq.length;
          var gc = Math.max(2, Math.ceil(Math.sqrt(n * 1.35)));
          var gr = Math.ceil(n / gc);
          var cells = [];
          for(var k2=0;k2<gc*gr;k2++) cells.push(k2);
          for(var i2=cells.length-1;i2>0;i2--){
            var j2 = Math.floor(rand() * (i2 + 1));
            var t2 = cells[i2]; cells[i2] = cells[j2]; cells[j2] = t2;
          }
          var pools = {};
          Object.keys(byColor).forEach(function(k){ pools[k] = byColor[k].slice(); });
          P.solution = [];
          seq.forEach(function(c, idx){
            var b = pools[c].pop();
            var cell = cells[idx];
            var cx = cell % gc, cy = Math.floor(cell / gc);
            b.fx = Math.min(1, Math.max(0, (cx + rand() + (rand() - 0.5) * 0.9) / gc));
            b.fy = Math.min(1, Math.max(0, (cy + rand() + (rand() - 0.5) * 0.9) / gr));
            b.rot = (rand() - 0.5) * 60;
            b.z = n - 1 - idx;
            P.solution.push(b.id);
          });
          if(reduced){
            layoutPile(true);
            sndFlip();
            return;
          }
          /* 动画：新摆放（上面刚算好的、按当前槽况保证有解的
             那一局）先不落位——堆里剩下的块先原地整体轻轻浮起、
             错落晃动约 450ms（.shufflewob 靠 margin 浮起，每块
             一个固定的错开相位与滑行延时），再由 layoutPile(true)
             的过渡平滑滑到新位置落定、压住关系随之刷新。全程
             busy 锁点击，洗牌声沿用翻牌声 */
          P.busy = true;
          sndFlip();
          var nonce = P.dealNonce;
          var ordered = alive.slice().sort(function(a, b){ return a.id - b.id; });
          ordered.forEach(function(b, i){
            b.el.style.transitionDelay = ((i * 37) % 120) + "ms";
            b.el.style.animationDelay = (-((i * 53) % 200)) + "ms";
            b.el.classList.add("shufflewob");
          });
          setTimeout(function(){
            if(P.dealNonce !== nonce) return;   /* 晃动中重开了本关：新局自有状态 */
            alive.forEach(function(b){ b.el.classList.remove("shufflewob"); });
            layoutPile(true);
            setTimeout(function(){
              alive.forEach(function(b){
                b.el.style.transitionDelay = "";
                b.el.style.animationDelay = "";
              });
              if(P.dealNonce !== nonce) return;
              P.busy = false;
            }, 440);
          }, 450);
        }

        document.getElementById("toolOut").addEventListener("click", toolOut);
        document.getElementById("toolCombine").addEventListener("click", toolCombine);
        document.getElementById("toolShuffle").addEventListener("click", toolShuffle);

        document.getElementById("pileAgainBtn").addEventListener("click", function(){
          P.attempt++;
          dealPile();
        });
        pileArea.addEventListener("contextmenu", function(e){ e.preventDefault(); });
        window.addEventListener("resize", function(){ layoutPile(false); });
        window.addEventListener("orientationchange", function(){ setTimeout(function(){ layoutPile(false); }, 60); });

        /* ================= memory game ================= */
        var memGrid = document.getElementById("memGrid");
        var M = { open:[], matched:0, moves:0, seconds:0, timer:null, started:false, lock:false, done:false };
        var memBuilt = false;   /* 牌阵建过没有：第一次切到翻牌才建 */

        function memStop(){ if(M.timer){ clearInterval(M.timer); M.timer = null; } }
        function memStart(){
          if(M.timer) return;
          M.timer = setInterval(function(){
            M.seconds++;
            document.getElementById("memTime").textContent = fmt(M.seconds);
          }, 1000);
        }

        /* repaint the dealt memory cards with the current theme's
           card set: the front <img> source changes and the back
           swaps to this theme's own back design (奶蛙家族 has no
           back image — its cards get the blank 米黄 face instead),
           so flipped / matched state, the open pair, moves and
           timer all carry over untouched */
        function paintMemoryCards(){
          var set = CARD_SETS[curTheme];
          if(!set) return;
          memGrid.querySelectorAll(".mem-card").forEach(function(btn){
            var key = parseInt(btn.getAttribute("data-key"), 10);
            var faceImg = btn.querySelector(".mem-front img");
            if(faceImg && set.faces[key]) faceImg.src = set.faces[key];
            var backEl = btn.querySelector(".mem-back");
            if(backEl){
              backEl.classList.toggle("blank", !set.back);
              var backImg = backEl.querySelector("img");
              if(set.back){
                if(!backImg){
                  backImg = document.createElement("img");
                  backImg.className = "card-img";
                  backImg.alt = "";
                  backImg.setAttribute("draggable", "false");
                  backEl.appendChild(backImg);
                }
                backImg.src = set.back;
              } else if(backImg){
                backImg.remove();
              }
            }
            if(btn.classList.contains("flipped") && set.names[key]){
              btn.setAttribute("aria-label", set.names[key]);
            }
          });
        }

        function buildMemory(){
          memBuilt = true;
          M.open = []; M.matched = 0; M.moves = 0; M.seconds = 0; M.started = false; M.lock = false; M.done = false;
          memStop();
          document.getElementById("memMoves").textContent = "0";
          document.getElementById("memPairs").textContent = "0";
          document.getElementById("memTime").textContent = "00:00";
          document.getElementById("memBanner").classList.remove("show");
          var set = CARD_SETS[curTheme];
          var keys = set.faces.map(function(_, i){ return i; });
          var deck = shuffleArr(keys.concat(keys).map(function(k){ return { key:k }; }));
          memGrid.innerHTML = "";
          deck.forEach(function(card){
            var b = document.createElement("button");
            b.type = "button"; b.className = "mem-card";
            b.setAttribute("aria-label", "未翻开的牌");
            b.setAttribute("data-key", card.key);
            b.innerHTML =
              "<span class='mem-inner'>" +
                "<span class='mem-side mem-back" + (set.back ? "" : " blank") + "'>" +
                  (set.back ? "<img class='card-img' src='" + set.back + "' alt='' draggable='false'>" : "") +
                "</span>" +
                "<span class='mem-side mem-front'><img class='card-img' src='" + set.faces[card.key] + "' alt='' draggable='false'></span>" +
              "</span>";
            b.addEventListener("click", function(){ flipCard(b, card); });
            memGrid.appendChild(b);
          });
        }

        function flipCard(btn, card){
          if(M.lock || M.done) return;
          if(btn.classList.contains("flipped")) return;
          ac();
          if(!M.started){ M.started = true; memStart(); }
          btn.classList.add("flipped");
          btn.setAttribute("aria-label", CARD_SETS[curTheme].names[card.key]);
          sndFlip();
          M.open.push({ btn:btn, card:card });
          if(M.open.length < 2) return;
          M.moves++;
          document.getElementById("memMoves").textContent = M.moves;
          var a = M.open[0], b2 = M.open[1];
          if(a.card.key === b2.card.key){
            a.btn.classList.add("matched"); b2.btn.classList.add("matched");
            M.open = []; M.matched++;
            document.getElementById("memPairs").textContent = M.matched;
            sndPair();
            if(M.matched === CARD_SETS[curTheme].faces.length){
              M.done = true; memStop(); sndWin(); confetti();
              document.getElementById("memDetail").textContent = M.moves + " 次翻牌 · " + fmt(M.seconds);
              document.getElementById("memBanner").classList.add("show");
            }
          } else {
            M.lock = true;
            setTimeout(function(){
              a.btn.classList.remove("flipped"); b2.btn.classList.remove("flipped");
              a.btn.setAttribute("aria-label", "未翻开的牌");
              b2.btn.setAttribute("aria-label", "未翻开的牌");
              M.open = []; M.lock = false;
            }, 750);
          }
        }

        /* 记忆翻牌结算条的「再来一局」：和另外两个游戏的
           「再来一次」是同一颗 .btn.primary 样式，点它重新
           洗牌开新局——buildMemory 本身就把翻牌次数、已配对
           和用时全部清零，并按当前装扮换一副新牌 */
        document.getElementById("memAgainBtn").addEventListener("click", function(){
          buildMemory();
          sndSelect();
        });

        /* ================= 开始页 · 过场幕布 · 背景音乐 ================= */
        var bgm = document.getElementById("bgm");
        /* 循环钉死：loop 属性之外再用 JS 明确设一遍，并兜住
           ended 事件——某些内置浏览器不认 loop 属性、曲子放完
           就停，只要音乐开关开着，ended 一到就从头续播 */
        if(bgm){ bgm.loop = true; bgm.volume = 0.5; }
        function bgmPlay(){
          if(!bgm) return;
          var p = bgm.play();
          if(p && p.catch) p.catch(function(){});
        }
        if(bgm) bgm.addEventListener("ended", function(){
          if(!musicOn) return;
          try{ bgm.currentTime = 0; }catch(e){}
          bgmPlay();
        });
        /* 页面被切到后台又回来时，有些浏览器会把音频暂停：
           回到前台时开关还开着、音乐却停了，就续上（不从头） */
        document.addEventListener("visibilitychange", function(){
          if(!document.hidden && musicOn && started && bgm && bgm.paused) bgmPlay();
        });

        /* 音乐按键：只管背景音乐，和音效按键互不干扰；
           关着的时候图标上划一道斜杠（.off，见 CSS） */
        var musicOn = true;
        var musicBtn = document.getElementById("musicBtn");
        musicBtn.addEventListener("click", function(){
          /* 先切状态与斜杠，再碰音频：音频调用万一抛错或被拒，
             也不能把开关状态和斜杠一起带走 */
          musicOn = !musicOn;
          musicBtn.classList.toggle("off", !musicOn);
          musicBtn.setAttribute("aria-pressed", String(musicOn));
          musicBtn.setAttribute("aria-label", musicOn ? "音乐开" : "音乐关");
          if(!bgm) return;
          try{
            if(musicOn) bgmPlay();
            else bgm.pause();
          }catch(e){}
        });

        /* 开始页圆圈：7 个莫兰迪色块（当前皮肤前 7 色）围成一圈，
           踩着背景音乐约 112 BPM 的拍子一格一格走——每步约
           0.54 秒，滑动约 0.33 秒（CSS transition，带一点回弹），
           余下约 0.21 秒停顿；到达最上方的块轻轻放大一下 */
        var orbitRing = document.getElementById("orbitRing");
        var orbitFaces = [];
        THEMES.morandi.colors.slice(0, 7).forEach(function(c, i){
          var arm = document.createElement("div");
          arm.className = "orbit-arm";
          arm.style.transform = "rotate(" + (i * 360 / 7) + "deg)";
          var chip = document.createElement("div");
          chip.className = "orbit-chip";
          var face = document.createElement("div");
          face.className = "face";
          face.style.background = c;
          chip.appendChild(face);
          arm.appendChild(chip);
          orbitRing.appendChild(arm);
          orbitFaces.push(face);
        });
        var orbitStep = 0, orbitTimer = null;
        function orbitTick(){
          orbitStep++;
          orbitRing.style.transform = "rotate(" + (-orbitStep * 360 / 7) + "deg)";
          var topFace = orbitFaces[orbitStep % 7];
          topFace.classList.remove("pop");
          void topFace.offsetWidth;
          topFace.classList.add("pop");
        }
        if(!reduced) orbitTimer = setInterval(orbitTick, 535);

        /* 幕布中央的色块：每次打开页面时，从当前皮肤的 9 个块里
           随机选一个（8 个颜色 + 彩虹）；打开时是默认的莫兰迪，
           用 paintFace 按那套皮肤的样子画 */
        (function paintCurtainBlock(){
          var pick = Math.floor(Math.random() * 9);
          paintFace(document.getElementById("curtainFace"), { color: pick === 8 ? -1 : pick });
        })();

        /* 开始页的三个玩法键：点选即选中（高亮跟随），默认
           彩块归位；这里只记选择、不切面板，点 ▶ 时才切到
           选中的玩法。从游戏回主页再进来，选择原样保留 */
        var homeGame = "blocks";
        document.querySelectorAll(".sg-btn").forEach(function(b){
          b.addEventListener("click", function(){
            homeGame = b.getAttribute("data-sgame");
            document.querySelectorAll(".sg-btn").forEach(function(x){
              x.setAttribute("aria-pressed", String(x === b));
            });
            sndSelect();
          });
        });

        /* 从主页切换到另一个玩法时，那个玩法新开一局：停在
           它自己的当前关卡重新发牌（归位重排本关、堆消重摆
           本关、翻牌重新洗牌） */
        function freshStartGame(name){
          if(name === "blocks") loadLevel(G.level);
          else if(name === "pile") loadPileLevel(P.level);
          else if(name === "memory") buildMemory();
        }

        /* 点「开始游戏」：先切到开始页选中的玩法，音乐起播
           （浏览器只允许点按之后出声），幕布盖满全屏，停约
           1.2 秒后向上揭开露出游戏界面。
           回主页再进来时：选的还是刚才那个玩法，就只切面板、
           不调 freshStartGame——原来的棋盘、关卡进度原样
           保留，不重开；只有在主页改选了另一个玩法，才给
           那个玩法新开一局 */
        var started = false;
        document.getElementById("startBtn").addEventListener("click", function(){
          if(started) return;
          started = true;
          var switched = homeGame !== curGame;
          showGame(homeGame);
          if(switched) freshStartGame(homeGame);
          if(orbitTimer){ clearInterval(orbitTimer); orbitTimer = null; }
          if(musicOn) bgmPlay();
          var curtain = document.getElementById("curtain");
          curtain.classList.add("cover");
          setTimeout(function(){
            document.getElementById("startScreen").classList.add("done");
            /* 切到升起前，先强制提交一次「已盖严」的样式（读一次
               布局，触发同步重排），再挂 lift 类：盖下动画停在
               translateY(0) 的终态先落定，升起动画（含 .3s 延迟
               期间的反向填充，见 CSS）从这一帧无缝接管，中间
               不留任何一帧幕布失去变换、露出游戏画面的空档 */
            void curtain.offsetHeight;
            curtain.classList.add("lift");
          }, 500 + 1200);
          setTimeout(function(){
            curtain.classList.add("gone");
            fitBoard();
          }, 500 + 1200 + 1200);
        });

        /* ---- refit triggers: some browsers only learn their real
           viewport late — app-embedded webviews reporting a provisional
           size at first layout, the address bar showing or hiding, a
           late font swap reflowing the top bar. Every such moment
           refits the board (and the pile), and the retry loop inside
           fitBoard keeps going until the markers and tiles are
           actually on screen, so a bad first measurement can no
           longer leave a permanently empty frame ---- */
        window.addEventListener("load", refitAll);
        if(document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function"){
          document.fonts.ready.then(function(){ refitAll(); });
        }
        if(window.visualViewport && window.visualViewport.addEventListener){
          window.visualViewport.addEventListener("resize", refitAll);
        }
        document.addEventListener("visibilitychange", function(){
          if(!document.hidden) refitAll();
        });

        /* 不在启动时建牌：showGame 第一次切到记忆翻牌时才调
           buildMemory，首屏因此不下载任何一张卡面卡背 */
      })();
    </script>
  </body>
</html>
