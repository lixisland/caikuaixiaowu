<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>彩块小屋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体改为不阻塞的加载：preload 拿样式表、加载完才切换为
         stylesheet 生效。在这之前页面脚本不等字体、先照常运行，
         棋盘照常生成；字体没回来时先用系统圆体顶着，回来后自动
         换上（两份样式都带 display=swap）。以前用普通 stylesheet
         链接时，排在后面的脚本必须等字体样式表回来才肯执行，
         字体服务器一直不回应，棋盘就一直生成不出来 -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <!-- 站酷快乐体只用在 .display 标题上，用字是固定的一小批：
         按实际用字取子集，一个分片就够，不再整表分片下载 -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&text=%E8%A3%85%E6%89%AE%E5%85%B3%E5%8D%A1%E7%8E%A9%E6%B3%95%E5%BD%A9%E5%9D%97%E5%BD%92%E4%BD%8D%E5%A0%86%E6%B6%88%E8%AE%B0%E5%BF%86%E7%BF%BB%E7%89%8C%E8%BF%87%E5%95%A6%E9%85%8D%E5%AF%B9%E5%AE%8C%E6%88%90%E7%BB%8F%E5%85%B8%E6%8C%91%E6%88%98%E8%99%B9%E8%BF%9B%E9%98%B6%E7%83%AD%E8%BA%AB%EF%BC%8C%E6%A0%87%E5%87%86%E6%BB%A1%E7%BC%A4%E7%BA%B7%E6%9E%81%E8%87%B4%E6%A0%BC%E5%AD%90%E5%9C%B0%E7%8B%B1&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&text=%E8%A3%85%E6%89%AE%E5%85%B3%E5%8D%A1%E7%8E%A9%E6%B3%95%E5%BD%A9%E5%9D%97%E5%BD%92%E4%BD%8D%E5%A0%86%E6%B6%88%E8%AE%B0%E5%BF%86%E7%BF%BB%E7%89%8C%E8%BF%87%E5%95%A6%E9%85%8D%E5%AF%B9%E5%AE%8C%E6%88%90%E7%BB%8F%E5%85%B8%E6%8C%91%E6%88%98%E8%99%B9%E8%BF%9B%E9%98%B6%E7%83%AD%E8%BA%AB%EF%BC%8C%E6%A0%87%E5%87%86%E6%BB%A1%E7%BC%A4%E7%BA%B7%E6%9E%81%E8%87%B4%E6%A0%BC%E5%AD%90%E5%9C%B0%E7%8B%B1&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }

      :root{
        --bg:#ECE9E1;
        --surface:#F5F2EB;
        --surface-2:#E3DED2;
        --ink:#4B463E;
        --ink-soft:#7E7768;
        --line:#D8D2C4;
        --sage:#8FA382;
        --sage-deep:#6F8563;
        --gold:#C9A86A;
        --board-bg:#E0DACD;
        --slot:#D5CFBF;
        --tab-on:#4B463E;
        --tab-on-ink:#F5F2EB;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#2B2925;
          --surface:#35322C;
          --surface-2:#403C34;
          --ink:#E9E4D6;
          --ink-soft:#ABA294;
          --line:#4C473C;
          --sage:#9DB48D;
          --sage-deep:#AEC79E;
          --board-bg:#3B382F;
          --slot:#454136;
          --tab-on:#E9E4D6;
          --tab-on-ink:#35322C;
          color-scheme: dark;
        }
      }

      /* ---------- fixed screen: no scrolling, ever ---------- */
      html{
        -webkit-text-size-adjust:100%;
        height:100%;
        overflow:hidden;
        overscroll-behavior:none;
      }
      body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:"Baloo 2","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        line-height:1.55;
        /* vh first as the fallback for webviews that do not know dvh
           yet (older Android in-app browsers): without it the height
           declaration is dropped entirely and the board frame can
           measure 0 on first layout; dvh wins wherever supported */
        height:100vh;
        height:100dvh;
        overflow:hidden;
        overscroll-behavior:none;
        position:fixed;
        inset:0;
        width:100%;
      }
      h1,h2,h3,p,ul,ol,figure{ margin:0; }
      ul,ol{ padding:0; list-style:none; }
      button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
      .display{ font-family:"ZCOOL KuaiLe","Baloo 2","PingFang SC","Microsoft YaHei",sans-serif; }

      .wrap{
        position:relative;
        max-width:680px; margin:0 auto;
        height:100vh; height:100dvh; box-sizing:border-box;
        padding:10px 12px 12px;
        display:flex; flex-direction:column;
        overflow:hidden;
      }

      /* ---------- top bar: round buttons ---------- */
      .topbar{
        position:relative;
        display:flex; align-items:flex-start; justify-content:space-between;
        /* z-index 压在扇层（120）之上：四键收起时正落在齿轮处，
           要藏在齿轮后面、从齿轮后面飞出来；顶栏其余键与下方
           托盘（top:72px 起）不重叠，抬高不影响它们 */
        gap:10px; flex:none; z-index:130;
      }
      .round-group{ display:flex; gap:8px; }
      /* 顶栏本身不接点击：它是一条横贯整行的盒子，z-index 又在
         扇层之上，音乐键（190°，落在齿轮左上方、与齿轮同高的这一行、左右
         两组键之间的空档里）展开后正好被这条看不见的盒子盖住，
         点击全被它吞掉——四键里只有音乐键点不动就是这个原因。
         让顶栏穿透、只有真正的圆键接点击，空档处的点击落回
         下面的扇层，音乐键才点得到；顶栏自家键的命中不受影响 */
      .topbar{ pointer-events:none; }
      .topbar .round-btn{ pointer-events:auto; }
      /* 堆消的剩余计数：一个小 pill，坐在声音按钮左边，
         只在堆消面板显示时出现（见 showGame） */
      .top-right{ display:flex; align-items:center; gap:8px; }
      .pile-left{
        background:var(--surface); border:1.5px solid var(--line); border-radius:999px;
        padding:3px 11px; font-size:.78rem; color:var(--ink-soft); white-space:nowrap;
      }
      .pile-left[hidden]{ display:none; }
      .pile-left b{ color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; }
      .round-btn{
        width:52px; height:52px; min-height:52px; flex:none;
        border-radius:50%;
        border:1.5px solid var(--line);
        background:var(--surface); color:var(--ink);
        display:inline-flex; align-items:center; justify-content:center;
        font-size:.82rem; line-height:1.15; text-align:center;
        padding:0; user-select:none; -webkit-user-select:none;
      }
      .round-btn svg{ width:22px; height:22px; flex:none; }
      .round-btn[aria-expanded="true"]{ background:var(--tab-on); color:var(--tab-on-ink); border-color:var(--tab-on); }
      .round-btn:active{ transform:scale(.95); }
      /* 关卡键在没有关卡可选项的玩法（记忆翻牌）里整颗隐藏：
         .round-btn 自带 display 会盖掉 hidden 的默认样式，
         这里显式补上 */
      .round-btn[hidden]{ display:none; }

      /* --fan-p 注册为数值型自定义属性：不注册时它只能离散跳变，
         WAAPI 逐键动画就没法插值出飞行轨迹和回弹过冲 */
      @property --fan-p{ syntax:"<number>"; inherits:false; initial-value:0; }

      /* ---------- 设置键（粉齿轮图）+ 扇形展开 ---------- */
      /* 顶栏右端只剩这一个键：图填满圆键，展开时齿轮转半圈 */
      /* border:none：去掉 .round-btn 的 1.5px 描边——扇形四键没有
         这圈边，齿轮图自带的白圈就该是最外圈，白圈外不要再有棕圈 */
      #settingsBtn{ padding:0; overflow:hidden; position:relative; z-index:130; border:none; }
      #settingsBtn[aria-expanded="true"]{ background:var(--surface); color:inherit; }
      #settingsBtn img{
        width:100%; height:100%; display:block; border-radius:50%;
        transition:transform .4s ease;
      }
      #settingsBtn.open img{ transform:rotate(180deg); }
      /* 扇形展开：四个图键以齿轮为圆心、同半径、同夹角排在一条圆弧上
         —— 音乐 190°、音效 158°、主页 126°、装扮 94°
         （正左方为 180°、正下方为 90°，即屏幕坐标里
         x = 圆心x + R·cos(角)、y = 圆心y + R·sin(角)）。
         每键的目标位移在 HTML 里以 --fx / --fy 定死（R = 86px 时
         的精确值，四键到圆心的距离都是 86px，误差 < 0.1px；
         音乐键转到 190° 后上移约 15px，键顶仍在屏幕上沿之内，
         装扮键（94°，几乎正下方）展开后也不出屏幕边缘）；
         JS 按 JS 测得的齿轮圆心把这一层定位（见 positionSettingsFan），
         动画只动 --fan-p（0 = 收在齿轮处，1 = 落在弧上），
         所以展开中途和落定后四键始终同心等距。
         这一层盖在界面最上层（z-index 高于牌、色块与托盘），
         收起时整层不接点击、不占版面，展开动画带轻微回弹 */
      .settings-fan{
        position:absolute; left:0; top:0; width:0; height:0;
        z-index:120; pointer-events:none; visibility:hidden;
      }
      .settings-fan.open, .settings-fan.closing{ visibility:visible; }
      .icon-btn{
        --fan-p:0;
        position:absolute; left:0; top:0;
        width:46px; height:46px; min-height:46px; flex:none;
        margin:-23px 0 0 -23px;
        border-radius:50%; padding:0; background:none;
        display:inline-flex; align-items:center; justify-content:center;
        user-select:none; -webkit-user-select:none;
        transform:translate(calc(var(--fx) * var(--fan-p)), calc(var(--fy) * var(--fan-p)));
        opacity:0; pointer-events:none;
      }
      .icon-btn img{ width:100%; height:100%; display:block; border-radius:50%; pointer-events:none; }
      /* 完全收起时（非展开、非收回途中）四键不渲染，和原竖卡
         display:none 时一样，不留在版面与无障碍树里 */
      .settings-fan:not(.open):not(.closing) .icon-btn{ display:none; }
      .settings-fan.open .icon-btn, .settings-fan.closing .icon-btn{ opacity:1; }
      .settings-fan.open .icon-btn{ pointer-events:auto; }
      .icon-btn:active{ transform:translate(calc(var(--fx) * var(--fan-p)), calc(var(--fy) * var(--fan-p))) scale(.95); }
      @media (max-width:420px){
        .icon-btn{ width:42px; height:42px; min-height:42px; margin:-21px 0 0 -21px; }
      }
      @media (prefers-reduced-motion: reduce){
        #settingsBtn img{ transition:none; }
      }

      /* expandable tray under the round buttons: a floating overlay
         that hangs over the top of the board frame. The levels tray
         is a pure overlay — opening or closing it never resizes or
         moves the board (装扮已改成整页的装扮页，不再是托盘) */
      .tray{
        display:none;
        /* z-index sits above the heap: the pile area is its own
           stacking context (z-index:0 on .pile-area), so however
           deep a tile's in-heap order runs (up to 900 on the
           challenge heap) it can never climb out and cover an
           open tray — all six level buttons stay visible and
           tappable */
        position:absolute; top:72px; left:12px; z-index:90;
        max-width:min(88vw, 400px);
        background:var(--surface); border:1.5px solid var(--line); border-radius:14px;
        padding:7px;
        flex-wrap:wrap; gap:5px;
        box-shadow:0 12px 26px rgba(74,64,44,.20);
      }
      @media (max-width:420px){ .tray{ top:68px; } }
      .tray.open{ display:flex; }
      .tray .opt{
        border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
        border-radius:999px; padding:2px 10px; font-size:.76rem; min-height:1.9rem;
        display:inline-flex; align-items:center; gap:5px;
      }
      .tray .opt .dots{ display:inline-flex; gap:2px; }
      .tray .opt .dots i{ width:9px; height:9px; border-radius:50%; display:block; box-shadow:inset 0 0 0 1px rgba(74,64,44,.18); }
      .tray .opt[aria-pressed="true"]{ background:var(--sage); border-color:var(--sage); color:#fff; }
      @media (prefers-color-scheme: dark){ .tray .opt[aria-pressed="true"]{ color:#2B2925; } }

      /* ---------- game panels ---------- */
      .panel{ display:none; }
      .panel.on{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; margin-top:10px; }

      /* ---------- shared game chrome ---------- */
      .hud{ display:flex; gap:8px; align-items:stretch; margin-bottom:10px; flex:none; }
      .stat{
        background:var(--surface); border:1.5px solid var(--line); border-radius:16px;
        padding:5px 14px; min-width:80px; flex:1 1 0;
      }
      .stat .k{ font-size:.72rem; color:var(--ink-soft); letter-spacing:.08em; }
      .stat .v{ font-size:1.12rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.25; }
      .stat .v small{ font-size:.8rem; color:var(--ink-soft); font-weight:500; }

      .controls{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; flex:none; }
      .btn{
        border:1.5px solid var(--line); background:var(--surface); border-radius:14px;
        padding:8px 18px; font-size:.95rem; min-height:2.75rem;
        display:inline-flex; align-items:center; gap:7px;
      }
      .btn.primary{ background:var(--sage); border-color:var(--sage); color:#fff; }
      @media (prefers-color-scheme: dark){ .btn.primary{ color:#2B2925; } }
      .btn:active{ transform:scale(.97); }

      /* ---------- block game ---------- */
      .board-frame{
        /* extra top padding shifts the whole board stack (dot row +
           tiles + overflow block) a little lower inside the beige
           frame, so it no longer hugs the top edge */
        background:var(--board-bg); border-radius:26px; padding:30px 12px 12px;
        flex:1 1 auto; min-height:0;
        display:flex; align-items:center; justify-content:center;
        box-sizing:border-box;
      }
      .board-stack{ position:relative; flex:none; }
      /* the dots above row 1 are the tap targets: each marker button spans
         its whole column and the full marker row, so the small dot is easy
         to hit; no press/click feedback animation anywhere */
      .markers{ display:flex; height:40px; flex:none; }
      .marker{
        flex:1 1 0; display:flex; align-items:center; justify-content:center;
        padding:0; min-height:0; cursor:pointer; background:none;
        -webkit-tap-highlight-color:transparent; outline:none;
        appearance:none; -webkit-appearance:none;
      }
      .marker:active, .marker:focus, .marker:focus-visible{ background:none; outline:none; box-shadow:none; transform:none; }
      .marker .pip{ pointer-events:none; }
      .marker .pip{
        width:14px; height:14px; border-radius:50%;
        background:var(--slot); color:transparent;
        display:flex; align-items:center; justify-content:center;
        font-size:.8rem; font-weight:700;
        transition:background .25s ease, color .25s ease, width .25s ease, height .25s ease;
      }
      .marker.done .pip{ width:24px; height:24px; background:var(--sage); color:#fff; }
      @media (prefers-color-scheme: dark){ .marker.done .pip{ color:#2B2925; } }

      /* tiles live in one coordinate system inside .board (which itself sits
         below the marker row): board cells, the entry point above row 1 and
         the frameless overflow spot below the last row are all just
         translate() targets, so every move is a real transform transition */
      .board{ position:absolute; left:0; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
      .tile{
        position:absolute; left:0; top:0; padding:3px; box-sizing:border-box;
        transition:transform .28s cubic-bezier(.33,.7,.3,1);
        min-height:0; will-change:transform;
      }
      .tile.flying{ z-index:6; transition-duration:.2s; }
      .board.no-anim .tile{ transition:none; }
      .tile .face{
        width:100%; height:100%;
        border-radius:16px;
        /* a constant 2px rim lives on every face (transparent unless a
           theme paints it) so themes can add a darker same-colour edge
           without changing the tile geometry */
        box-sizing:border-box;
        border:2px solid transparent;
        background-clip:padding-box;
      }
      .board.jelly .tile .face,
      .dress-card.jelly .tile .face{
        box-shadow: inset 0 9px 13px rgba(255,255,255,.5), inset 0 -11px 15px rgba(31,26,20,.12);
      }
      /* image themes (glass / egg): the face paints nothing itself —
         no fill, no rim, no shadow; the cutout image inside carries
         the whole look, shown whole at its own aspect ratio, never
         stretched or cropped */
      .board.glassimg .tile .face,
      .board.eggimg .tile .face,
      .board.frogimg .tile .face,
      .dress-card.glassimg .tile .face,
      .dress-card.eggimg .tile .face,
      .dress-card.frogimg .tile .face{ background:transparent; border-color:transparent; box-shadow:none; }
      .tile .face .skin-img{
        display:block; width:100%; height:100%;
        object-fit:contain; pointer-events:none;
        -webkit-user-drag:none;
      }
      /* glass only, per request: the cutout sits a little larger in
         its tile (about 112%), allowed to breathe out to the cell
         edge; the egg theme and every CSS theme stay at 100% */
      .board.glassimg .tile .face .skin-img,
      .dress-card.glassimg .tile .face .skin-img{ transform:scale(1.12); }

      /* ---------- 装扮页（整页，替换原装扮托盘） ----------
         六张全宽卡片竖排，每卡左上角是套装名，下面一排 9 个块。
         卡里的块不另画：格子就是游戏里的 .tile、脸就是 .face，
         由 paintFace 按那一套自己的皮肤当场上色 / 挂原图
         （见 JS 的 paintFaceAs）；果冻的内阴影、图片套的透明
         脸、玻璃的 112% 放大都靠上面三条规则补上的 .dress-card
         选择器，和棋盘上是同一套画法。页面自身可上下滚动
         （六张卡放不进一屏时），游戏外壳仍是固定不滚的 */
      .dress-page{
        position:fixed; inset:0; z-index:150;
        background:var(--bg); color:var(--ink);
        overflow-y:auto; -webkit-overflow-scrolling:touch;
        box-sizing:border-box;
      }
      .dress-page[hidden]{ display:none; }
      .dress-inner{ max-width:680px; margin:0 auto; padding:10px 12px 22px; box-sizing:border-box; }
      .dress-head{
        position:relative; display:flex; align-items:center; justify-content:center;
        min-height:52px; margin-bottom:12px;
      }
      .dress-back{
        position:absolute; left:0; top:50%; transform:translateY(-50%);
        width:52px; height:52px; min-height:52px; border-radius:50%;
        border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
        display:inline-flex; align-items:center; justify-content:center; padding:0;
      }
      .dress-back svg{ width:22px; height:22px; flex:none; }
      .dress-back:active{ transform:translateY(-50%) scale(.95); }
      .dress-title{ font-size:1.25rem; }
      .dress-list{ display:flex; flex-direction:column; gap:12px; }
      .dress-card{
        display:block; width:100%; box-sizing:border-box; text-align:left;
        background:var(--surface); border:1.5px solid var(--line); border-radius:18px;
        padding:12px 14px 14px; cursor:pointer;
      }
      /* 正在使用中的卡片：一圈棕色描边（外加一道同色细光圈
         让圈看得清），名字旁再配一颗「使用中」标记 */
      .dress-card[aria-pressed="true"]{
        border-color:#9A7B57;
        box-shadow:0 0 0 2px #9A7B57;
      }
      .dress-card-head{ display:flex; align-items:center; gap:8px; min-height:1.45em; margin-bottom:10px; }
      .dress-name{ font-size:1rem; font-weight:700; }
      .dress-using{
        display:none; font-size:.72rem; line-height:1.5; color:#fff; background:#9A7B57;
        border-radius:999px; padding:1px 9px;
      }
      .dress-card[aria-pressed="true"] .dress-using{ display:inline-block; }
      .dress-row{ display:flex; gap:5px; }
      /* 格子借用 .tile 的盒型（3px 内衬、脸的圆角与边框槽都
         随之而来），只把绝对定位改成随卡片排布的普通格子 */
      .dress-card .tile{
        position:relative; left:auto; top:auto;
        flex:1 1 0; aspect-ratio:4/4.6;
        transition:none; will-change:auto;
      }
      .dress-card .face{ display:block; }

      /* win banner */
      .win-banner{
        display:none; margin-top:10px; background:var(--surface);
        border:1.5px solid var(--sage); border-radius:18px; padding:10px 14px;
        align-items:center; gap:12px; flex-wrap:wrap; flex:none;
      }
      .win-banner.show{ display:flex; }
      .win-banner .msg{ flex:1 1 160px; }
      .win-banner .msg b{ font-size:1.05rem; }
      .win-banner .msg span{ display:block; color:var(--ink-soft); font-size:.88rem; }
      /* pile panel: the settlement banner's space stays reserved
         even while the banner itself is hidden, so the pile frame
         keeps one fixed height — the shorter one it has while the
         banner is up — instead of stretching taller during play and
         shrinking back when the banner appears. The banner's height
         is set by its button, which never changes size, so the
         reserved space matches the shown banner exactly; the frame's
         inner area (and with it the tiles' placement range) is the
         short one throughout. The memory game keeps the old
         show/hide behaviour */
      #panel-pile .win-banner{ display:flex; visibility:hidden; }
      #panel-pile .win-banner.show{ visibility:visible; }
      /* blocks panel: the same fixed position, reached differently —
         the panel always reserves the banner's strip (its 68px
         height + the 10px gap above it) as bottom padding, and the
         banner itself sits absolutely in that reserved strip. The
         board frame therefore keeps the shorter, settled height it
         has in the win state whether or not the banner is showing,
         the board stack (dot row + tiles + overflow block) stays at
         that default position, and the frame's bottom edge and the
         space below it stay clear of the screen bottom. The hidden
         banner keeps the plain display:none behaviour, so its
         button is simply absent until the win */
      #panel-blocks{ position:relative; box-sizing:border-box; padding-bottom:78px; }
      #panel-blocks .win-banner{ position:absolute; left:0; right:0; bottom:0; margin-top:0; }

      /* ---------- memory game ---------- */
      /* the grid sits partway down the holder: not the old centred
         position with its big blank above, not hugging the stats
         either — halfway between the two */
      .mem-holder{ flex:1 1 auto; min-height:0; display:flex; align-items:flex-start; justify-content:center; padding-top:6vh; padding-top:6dvh; box-sizing:border-box; }
      .mem-grid{
        display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
        width:min(100%, calc((100vh - 280px) * 0.75));
        width:min(100%, calc((100dvh - 280px) * 0.75));
      }
      .mem-card{ display:block; width:100%; aspect-ratio:3/4; perspective:600px; cursor:pointer; padding:0; min-height:0; }
      .mem-inner{
        display:block;
        position:relative; width:100%; height:100%;
        transform-style:preserve-3d; transition:transform .45s ease;
      }
      .mem-card.flipped .mem-inner{ transform:rotateY(180deg); }
      .mem-side{
        position:absolute; inset:0; border-radius:20px;
        display:flex; align-items:center; justify-content:center;
        backface-visibility:hidden; -webkit-backface-visibility:hidden;
      }
      /* card fronts are the finished design-sheet PNGs (270x360, the
         card's own 3:4 ratio): the front shows its image whole via
         contain and paints nothing itself. The back follows the
         theme: five themes show their own design-sheet back image
         whole via contain; only 奶蛙家族 uses a plain blank 米黄
         face — no image, no pattern */
      .mem-front{ background:transparent; }
      .mem-back{ background:transparent; }
      .mem-back.blank{
        background:#F6EED6;
        border:1.5px solid var(--line);
        box-sizing:border-box;
      }
      .mem-front{ transform:rotateY(180deg); }
      .mem-side .card-img{
        display:block; width:100%; height:100%;
        object-fit:contain; pointer-events:none;
        -webkit-user-drag:none;
      }
      .mem-card.matched{ cursor:default; }

      /* ---------- pile game （彩块堆消） ---------- */
      .pile-frame{
        background:var(--board-bg); border-radius:26px; padding:14px;
        flex:1 1 auto; min-height:0; box-sizing:border-box;
        display:flex;
      }
      .pile-area{
        position:relative; flex:1 1 auto; min-height:0;
        /* z-index:0 给堆区自成一个层叠上下文：块的 z 随堆叠深度
           一路排到 900（挑战堆），关在这一层里只决定块与块之间
           的上下，整片堆在外面只按 0 层参与排队 — 关卡托盘
           （z-90）因此永远完整压在堆上方、六个键都可点，不再
           被高层块盖住。堆框的大小与位置分毫不变 */
        z-index:0;
        background:var(--surface); border-radius:20px;
        box-shadow:inset 0 2px 12px rgba(74,64,44,.16);
        overflow:hidden;
        touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
      }
      .ptile{
        position:absolute; left:0; top:0; padding:3px; box-sizing:border-box;
        cursor:pointer; -webkit-tap-highlight-color:transparent;
        transition:transform .3s cubic-bezier(.33,.7,.3,1), filter .25s ease, opacity .22s ease;
        will-change:transform;
      }
      .ptile .face{
        width:100%; height:100%;
        border-radius:16px; border:2px solid transparent;
        box-sizing:border-box; background-clip:padding-box;
      }
      .pile-area.jelly .ptile .face{
        box-shadow: inset 0 9px 13px rgba(255,255,255,.5), inset 0 -11px 15px rgba(31,26,20,.12);
      }
      .pile-area.glassimg .ptile .face,
      .pile-area.eggimg .ptile .face,
      .pile-area.frogimg .ptile .face{ background:transparent; border-color:transparent; box-shadow:none; }
      .ptile .face .skin-img{
        display:block; width:100%; height:100%;
        object-fit:contain; pointer-events:none; -webkit-user-drag:none;
      }
      .pile-area.glassimg .ptile .face .skin-img{ transform:scale(1.12); }
      /* 奶蛙家族 in the pile game only: 奶蛙 (colour slot 0) is drawn
         a little larger so the figure fills its stacking-judgement
         shape better — the judgement polygon itself is unchanged,
         and every other character, plus 奶蛙 in the other two games,
         keeps its natural size. The slot bar wears the same size so
         a 奶蛙 looks the same in the heap and in the bar */
      .pile-area.frogimg .ptile[data-color="0"] .face .skin-img,
      .slotbar.frogimg .ttile[data-color="0"] .face .skin-img{ transform:scale(1.18); }
      /* solid-block thickness: every pile and tray tile carries an
         edge layer behind its face, offset a few px further down,
         painted from JS (paintPileTile) in a deeper shade of the
         block's own colour, so the blocks read as thick physical
         pieces stacked on each other */
      .ptile .edge{
        position:absolute; left:3px; right:3px; top:9px; bottom:-3px;
        border-radius:16px; z-index:0;
      }
      .ttile .edge{
        position:absolute; left:2px; right:2px; top:6px; bottom:-2px;
        border-radius:10px; z-index:0;
      }
      /* glass thickness: the glass blob's corners curve much further
         than a plain block's, so its bottom edge layer gets a
         noticeably rounder corner than the standard 16px / 10px */
      .pile-area.glassimg .ptile .edge{ border-radius:28px; }
      .slotbar.glassimg .ttile .edge{ border-radius:19px; }
      /* egg: no shadow — per request the edge layer under the egg
         is not shown at all, in the pile or in the slot bar; the
         eggs keep only the shading inside their own artwork. Other
         themes keep their thickness edge as before. The .edge
         element still exists (paintPileTile may paint it), it is
         simply never displayed under the egg theme */
      .pile-area.eggimg .ptile .edge,
      .slotbar.eggimg .ttile .edge,
      .pile-area.frogimg .ptile .edge,
      .slotbar.frogimg .ttile .edge{ display:none; }
      .ptile .face, .ttile .face{ position:relative; z-index:1; }
      .pile-area.no-anim .ptile{ transition:none; }
      .ptile.covered{ filter:brightness(.66) saturate(.78); cursor:default; }
      .ptile.shake .face{ animation:ptshake .25s ease; }
      @keyframes ptshake{ 25%{ transform:translateX(-3px); } 75%{ transform:translateX(3px); } }

      /* 挑战关道具动画（只加动画，规则不变，JS 里 reduced 时不启用）：
         .flytile 是移出 / 组合用的飞行块——真块的克隆、挂在 body 下
         fixed 定位按视口坐标飞，不受堆框 overflow 裁剪；长相照 .ptile
         补齐（脸、厚度边、图片套的图），主题差异（果冻内阴影、图片套
         透明底、玻璃图放大、奶蛙 0 号放大、图片套无厚度边、玻璃边
         更圆）随主题类一并带上。.toolflash 是组合的第一段：目标块的
         脸微微放大闪一下。.shufflewob 是打乱的第一段：块身靠 margin
         轻轻浮起晃动（不动 transform，免得和定位打架），相位由 JS
         给每块错开 */
      .flytile{
        position:fixed; left:0; top:0; padding:3px; box-sizing:border-box;
        pointer-events:none; will-change:transform;
      }
      .flytile .face{
        width:100%; height:100%;
        border-radius:16px; border:2px solid transparent;
        box-sizing:border-box; background-clip:padding-box;
        position:relative; z-index:1;
      }
      .flytile .edge{
        position:absolute; left:3px; right:3px; top:9px; bottom:-3px;
        border-radius:16px; z-index:0;
      }
      .flytile .face .skin-img{
        display:block; width:100%; height:100%;
        object-fit:contain; pointer-events:none; -webkit-user-drag:none;
      }
      .flytile.jelly .face{ box-shadow: inset 0 9px 13px rgba(255,255,255,.5), inset 0 -11px 15px rgba(31,26,20,.12); }
      .flytile.glassimg .face,
      .flytile.eggimg .face,
      .flytile.frogimg .face{ background:transparent; border-color:transparent; box-shadow:none; }
      .flytile.glassimg .face .skin-img{ transform:scale(1.12); }
      .flytile.frogimg[data-color="0"] .face .skin-img{ transform:scale(1.18); }
      .flytile.glassimg .edge{ border-radius:28px; }
      .flytile.eggimg .edge, .flytile.frogimg .edge{ display:none; }
      .ptile.toolflash .face, .ttile.toolflash .face{ animation:toolflash .22s ease; }
      @keyframes toolflash{
        0%{ transform:scale(1); filter:brightness(1); }
        45%{ transform:scale(1.15); filter:brightness(1.35); }
        100%{ transform:scale(1); filter:brightness(1); }
      }
      .ptile.shufflewob{ animation:pshuffle .45s ease-in-out; }
      @keyframes pshuffle{
        0%{ margin-top:0; }
        30%{ margin-top:-7px; }
        55%{ margin-top:-3px; }
        80%{ margin-top:-6px; }
        100%{ margin-top:0; }
      }

      /* 挑战关道具组：贴在顶部栏里、紧挨「关卡」键右侧的紧凑
         一组三键，只在挑战关出现（其余关卡与玩法 hidden）。它
         住在顶栏里、不进面板，所以出现 / 消失都不占面板版面 —
         堆框的大小和位置分毫不动；整组高度（圆 36px + 下方
         小字）压在顶栏原有的 52px 之内，顶栏高度也不变。圆是
         定稿的圆形图标原图；圆下面的功能名用游戏本身的深棕
         字 — 白字在米色面板上看不清，以看得清为准。用过一次
         后圆变灰、字变淡，再点无效（JS 里同步拦截）。顶栏本身
         pointer-events:none，这里把整组的点击接回来 */
      .pile-tools{ display:flex; gap:12px; pointer-events:auto; }
      .pile-tools[hidden]{ display:none; }
      .pile-tools .tool{ display:flex; flex-direction:column; align-items:center; gap:3px; }
      .tool-btn{
        width:36px; height:36px; border-radius:50%; padding:0; overflow:hidden;
        background:var(--surface); border:1.5px solid var(--line);
        box-shadow:0 2px 7px rgba(74,64,44,.20);
        display:flex; align-items:center; justify-content:center;
        -webkit-tap-highlight-color:transparent;
      }
      .tool-btn img{ display:block; width:100%; height:100%; object-fit:cover; pointer-events:none; -webkit-user-drag:none; }
      .tool-btn:active{ transform:scale(.93); }
      .tool-name{ font-size:.62rem; line-height:1.25; font-weight:600; color:var(--ink); white-space:nowrap; }
      .pile-tools .tool.used .tool-btn{ filter:grayscale(1); opacity:.45; box-shadow:none; }
      .pile-tools .tool.used .tool-name{ opacity:.45; }

      .slotbar{
        position:relative; flex:none; margin-top:10px;
        background:var(--surface-2); border-radius:16px; padding:8px;
        display:flex; gap:6px;
      }
      .slotbar .slot{
        flex:1 1 0; aspect-ratio:4/4.6; max-height:66px;
        background:var(--slot); border-radius:12px;
      }
      .tray-layer{ position:absolute; inset:0; pointer-events:none; }
      .ttile{
        position:absolute; left:0; top:0; padding:2px; box-sizing:border-box;
        transition:transform .25s cubic-bezier(.33,.7,.3,1), opacity .2s ease;
        will-change:transform;
      }
      .ttile .face{
        width:100%; height:100%;
        border-radius:10px; border:2px solid transparent;
        box-sizing:border-box; background-clip:padding-box;
      }
      .slotbar.jelly .ttile .face{
        box-shadow: inset 0 6px 9px rgba(255,255,255,.5), inset 0 -7px 10px rgba(31,26,20,.12);
      }
      .slotbar.glassimg .ttile .face,
      .slotbar.eggimg .ttile .face,
      .slotbar.frogimg .ttile .face{ background:transparent; border-color:transparent; box-shadow:none; }
      .ttile .face .skin-img{
        display:block; width:100%; height:100%;
        object-fit:contain; pointer-events:none; -webkit-user-drag:none;
      }
      .slotbar.glassimg .ttile .face .skin-img{ transform:scale(1.12); }

      .confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:60; }
      .confetti i{ position:absolute; top:-4vh; border-radius:5px; animation:fall linear forwards; }
      @keyframes fall{ to{ transform:translateY(110vh) rotate(340deg); } }

      @media (prefers-reduced-motion: reduce){
        .tile, .tile .face, .mem-inner, .marker .pip, .ptile, .ttile{ transition:none; animation:none; }
        .confetti{ display:none; }
      }
      @media (max-width:420px){
        .tile .face{ border-radius:13px; }
        .stat{ min-width:66px; padding:5px 10px; }
        .round-btn{ width:48px; height:48px; min-height:48px; font-size:.78rem; }
      }

      /* ---------- 开始页 ---------- */
      /* 打开先盖住游戏：奶油底 + 淡波点（和游戏同一套底色），
         顶部是扣好的房子 logo 图，中间七个莫兰迪色块围成一圈
         踩着拍子一格一格转；圆心的小圆盘就是开始键，里面
         只有一个 ▶ 三角形，没有文字 */
      .start-screen{
        position:fixed; inset:0; z-index:200;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:24px; padding:24px 16px 64px; box-sizing:border-box;
        background:
          radial-gradient(circle, rgba(139,124,90,.10) 1.6px, transparent 1.9px) 0 0 / 26px 26px,
          var(--bg);
      }
      .start-screen.done{ display:none; }
      /* logo 缩到原先约六成宽，整组内容因此往上收 */
      .start-logo{ width:min(47vw, 240px); height:auto; display:block; }
      /* logo 与旋转圆圈之间平放的三个玩法键：白色药丸键，点选即
         选中该玩法（选中态与托盘选项同一套鼠尾草绿高亮），
         默认选中彩块归位；开始仍是圆圈中心的 ▶ */
      .start-games{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
      .sg-btn{
        border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
        border-radius:999px; padding:7px 18px; font-size:.95rem; min-height:2.6rem;
        display:inline-flex; align-items:center;
      }
      .sg-btn[aria-pressed="true"]{ background:var(--sage); border-color:var(--sage); color:#fff; }
      @media (prefers-color-scheme: dark){ .sg-btn[aria-pressed="true"]{ color:#2B2925; } }
      .sg-btn:active{ transform:scale(.96); }
      .orbit{
        position:relative; flex:none;
        /* 玩法键插进 logo 与圆圈之间后，圆圈不再需要原来那段
           60px 的下移补空：留一小段间距即可，版面仍旧填满；
           圆圈（含中心 ▶）整体再下移 30px：开始页是居中纵列，
           直接加 margin-top 会把 logo 和玩法键一起顶上去，所以
           用不占布局的 translateY 单独挪圆圈，上面两样位置不动，
           底部有 64px 内边距垫着，圆圈不会被切、页面也不会滚动 */
        margin-top:14px;
        transform:translateY(30px);
        width:min(62vw, 250px, 34vh); width:min(62vw, 250px, 34dvh);
        height:min(62vw, 250px, 34vh); height:min(62vw, 250px, 34dvh);
      }
      .orbit::before{
        content:""; position:absolute; inset:0; border-radius:50%;
        border:2px dashed var(--line);
      }
      /* 圆心圆盘 = 开始按钮：只放一个 ▶ 三角形，无文字；
         无障碍标签仍是「开始游戏」，点击走原来的开始流程 */
      .orbit-disc{
        position:absolute; left:50%; top:50%; width:27%; height:27%;
        transform:translate(-50%,-50%); border-radius:50%;
        background:var(--surface-2);
        border:1.5px solid var(--line);
        box-shadow:0 4px 10px rgba(74,64,44,.12);
        display:flex; align-items:center; justify-content:center;
        padding:0; cursor:pointer; z-index:2;
      }
      .orbit-disc:active{ transform:translate(-50%,-50%) scale(.94); }
      .orbit-disc:focus-visible{ outline:2px solid var(--sage-deep); outline-offset:3px; }
      .orbit-disc .tri{
        width:0; height:0; flex:none; margin-left:4px;
        border-left:15px solid var(--sage-deep);
        border-top:9px solid transparent; border-bottom:9px solid transparent;
      }
      .orbit-ring{
        position:absolute; inset:0;
        transition:transform .33s cubic-bezier(.25,.8,.3,1.12);
        will-change:transform;
        pointer-events:none;
      }
      .orbit-arm{ position:absolute; inset:0; }
      .orbit-chip{
        position:absolute; left:50%; top:0;
        width:16.5%; aspect-ratio:4/4.6;
        transform:translate(-50%,-50%);
      }
      .orbit-chip .face{
        width:100%; height:100%; border-radius:20%;
        box-shadow:0 3px 0 rgba(74,64,44,.14);
      }
      .orbit-chip .face.pop{ animation:chipPop .45s ease; }
      @keyframes chipPop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
      /* ---------- 过场幕布 ---------- */
      /* 雾蓝底白波点：点开始后盖满全屏，中央停一个随机色块轻轻
         上下浮动；停约 1.2 秒后整块向上揭开，色块先滑到幕布
         下沿中央、坐在边上跟着一起升上去 */
      .curtain{
        position:fixed; inset:0; z-index:210;
        background:
          radial-gradient(circle, rgba(255,255,255,.5) 3px, transparent 3.7px) 0 0 / 34px 34px,
          radial-gradient(circle, rgba(255,255,255,.5) 3px, transparent 3.7px) 17px 17px / 34px 34px,
          #A9BFD4;
        transform:translateY(-100%);
        visibility:hidden;
      }
      .curtain.cover{ visibility:visible; animation:curtainDown .5s ease both; }
      /* 升起动画有 .3s 延迟（等色块先滑到幕布下沿）：填充必须用
         both，延迟期间先顶住起始帧 translateY(0)。以前只写
         forwards，延迟里没有反向填充，盖下动画又已被升起动画
         顶掉，幕布就退回基础样式的 translateY(-100%)——整块
         瞬间消失、游戏画面提前整段露出来，延迟结束才跳回盖严
         再升起，这就是升起前闪帧的根源。同时把 .lift 自身的
         静态 transform 也钉在 0：动画万一有一帧没接管，幕布的
         默认位置也是盖严，而不是藏在屏幕上方 */
      .curtain.lift{ visibility:visible; transform:translateY(0); animation:curtainUp .85s cubic-bezier(.5,0,.3,1) .3s both; }
      /* 盖下/揭开期间整块幕布提升为合成层：波点背景先栅格化进
         这一层，逐帧只由合成器搬运 transform，不再逐帧重绘
         大面积波点（升起卡顿的主因之一） */
      .curtain.cover, .curtain.lift{ will-change:transform; }
      .curtain.gone{ display:none; }
      @keyframes curtainDown{ from{ transform:translateY(-100%); } to{ transform:translateY(0); } }
      @keyframes curtainUp{ from{ transform:translateY(0); } to{ transform:translateY(-100%); } }
      .curtain-block{
        position:absolute; left:50%; top:50%;
        width:62px; aspect-ratio:4/4.6;
        transform:translate(-50%,-50%);
        /* 跟随幕布升起的滑动只走 transform（合成器动画）：
           以前过渡 top，每帧触发重排，幕布升起时明显卡顿。
           揭开时终点位移 = 向下半个幕布高再回中半个自身高，
           色块圆心正好落在幕布下沿、坐在边上，视觉与原来
           top:100% 时一模一样，时长也还是 .3s */
        transition:transform .3s ease;
        will-change:transform;
      }
      .curtain.lift .curtain-block{ transform:translate(-50%, calc(50vh - 50%)); transform:translate(-50%, calc(50dvh - 50%)); }
      .curtain-block .cface{
        width:100%; height:100%;
        border-radius:16px; border:2px solid transparent;
        box-sizing:border-box; background-clip:padding-box;
      }
      .curtain-block .cface .skin-img{
        display:block; width:100%; height:100%;
        object-fit:contain; pointer-events:none;
      }
      .curtain:not(.lift) .curtain-block .cface{ animation:curtainBob 1.6s ease-in-out infinite; }
      @keyframes curtainBob{ 0%,100%{ transform:translateY(-5px); } 50%{ transform:translateY(5px); } }

      /* ---------- 音乐 / 音效按键：关闭斜杠 ---------- */
      /* 两个键现在是扇形展开里的图键（.icon-btn），用的抠好的
         图标图；四个扇键共用同一道轻阴影 */
      .icon-btn{ box-shadow:0 2px 6px rgba(74,64,44,.12); }
      /* 圆形按键只要处于关闭状态，图标上就划一道斜杠：
         同一条规则，同角度、同色、同粗细，斜杠盖在图标图上 */
      .round-btn.off, .icon-btn.off{ position:relative; }
      .round-btn.off::after, .icon-btn.off::after{
        content:""; position:absolute; left:50%; top:50%;
        width:30px; height:3px; border-radius:2px;
        background:var(--ink);
        transform:translate(-50%,-50%) rotate(-45deg);
        pointer-events:none;
      }

      @media (prefers-reduced-motion: reduce){
        .orbit-ring, .curtain-block{ transition:none; }
        .orbit-chip .face.pop, .curtain, .curtain-block .cface{ animation:none; }
      }
    </style>
  </head>
  <body>
    <!-- 开始页：打开先看到它，点「开始游戏」后幕布盖下再揭开进游戏 -->
    <div class="start-screen" id="startScreen">
      <img class="start-logo" src="a7278dec2f2f0.png" alt="彩块小屋" />
      <div class="start-games" role="group" aria-label="选择玩法">
        <button class="sg-btn display" type="button" data-sgame="blocks" aria-pressed="true">彩块归位</button>
        <button class="sg-btn display" type="button" data-sgame="memory" aria-pressed="false">记忆翻牌</button>
        <button class="sg-btn display" type="button" data-sgame="pile" aria-pressed="false">彩块堆消</button>
      </div>
      <div class="orbit">
        <div class="orbit-ring" id="orbitRing" aria-hidden="true"></div>
        <button class="orbit-disc" id="startBtn" type="button" aria-label="开始游戏"><span class="tri" aria-hidden="true"></span></button>
      </div>
    </div>

    <!-- 过场幕布：中央的色块在打开页面时随机选定 -->
    <div class="curtain" id="curtain" aria-hidden="true">
      <div class="curtain-block"><div class="cface" id="curtainFace"></div></div>
    </div>

    <div class="wrap">
      <!-- top-left: 只剩「关卡」一颗键（玩法已移到开始页；
           记忆翻牌没有关卡，JS 会把这颗键藏掉）;
           top-right: 堆消剩余 pill + 设置（粉齿轮）键 -->
      <div class="topbar">
        <div class="round-group">
          <button class="round-btn display" id="btnLevels" type="button" aria-expanded="false" aria-controls="trayLevels">关卡</button>
          <!-- 挑战关专属道具组：紧挨关卡键右侧、同一行并排，只在
               挑战关显示（dealPile / showGame 控制 hidden）；住在
               顶栏里、不占面板版面，堆框的大小与位置不受它影响。
               三个圆是定稿的图标原图，圆正下方小字标注功能 -->
          <div class="pile-tools" id="pileTools" hidden>
            <div class="tool" id="toolOutWrap">
              <button class="tool-btn" id="toolOut" type="button" aria-label="道具：移出，把槽里最后一块退回堆里"><img src="aa0641b013b15.png" alt="" draggable="false" /></button>
              <span class="tool-name">移出</span>
            </div>
            <div class="tool" id="toolCombineWrap">
              <button class="tool-btn" id="toolCombine" type="button" aria-label="道具：组合，把一种颜色剩下的块全部消除"><img src="a2d31955f03c9.png" alt="" draggable="false" /></button>
              <span class="tool-name">组合</span>
            </div>
            <div class="tool" id="toolShuffleWrap">
              <button class="tool-btn" id="toolShuffle" type="button" aria-label="道具：打乱，把堆里剩下的块重新摆放"><img src="a312a94236673.png" alt="" draggable="false" /></button>
              <span class="tool-name">打乱</span>
            </div>
          </div>
        </div>
        <div class="top-right">
          <span class="pile-left" id="pileLeftChip" role="status" aria-label="堆里剩余块数" hidden>剩余 <b id="pileLeft">0</b> 块</span>
          <button class="round-btn" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsCard" aria-label="设置"><img src="afb23aa74cb6d.png" alt="" draggable="false" /></button>
        </div>
      </div>

      <!-- 关卡托盘是浮在棋盘框上方的纯浮层（打开/关闭都不动
           棋盘）；装扮不再用托盘，改走整页的装扮页（见下面） -->
      <div class="tray" id="trayLevels" role="group" aria-label="选择关卡"></div>

      <!-- 设置扇形：点顶栏齿轮展开，四个图键以齿轮为圆心扇形排开
           —— 音乐 190° / 音效 158° / 主页 126° / 装扮 94°，同半径 86px；
           --fx / --fy 是每键相对齿轮圆心的目标位移 -->
      <div class="settings-fan" id="settingsCard" role="group" aria-label="设置">
        <button class="icon-btn" id="musicBtn" type="button" aria-pressed="true" aria-label="音乐开" style="--fx:-84.69px;--fy:-14.93px"><img src="a24939f2827ed.png" alt="" draggable="false" /></button>
        <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="声音开" style="--fx:-79.74px;--fy:32.22px"><img src="a1d889e9d3fc5.png" alt="" draggable="false" /></button>
        <button class="icon-btn" id="homeBtn" type="button" aria-label="返回主页" style="--fx:-50.55px;--fy:69.58px"><img src="aa8687213b376.png" alt="" draggable="false" /></button>
        <button class="icon-btn" id="dressCardBtn" type="button" aria-label="装扮" style="--fx:-6px;--fy:85.79px"><img src="a87d45526f839.png" alt="" draggable="false" /></button>
      </div>

      <!-- ============ 彩块归位 ============ -->
      <section class="panel on" id="panel-blocks" aria-label="彩块归位">
        <div class="board-frame" id="boardFrame">
          <div class="board-stack" id="boardStack">
            <div class="markers" id="markers"></div>

        </div>

        <div class="win-banner" id="winBanner" role="status">

            <b class="display" id="winTitle">过关啦</b>
            <span id="winDetail"></span>
          </div>
          <button class="btn primary" id="nextLevelBtn" type="button">再来一次</button>
        </div>

      </section>

      <!-- ============ 彩块堆消 ============ -->
      <section class="panel" id="panel-pile" aria-label="彩块堆消">
        <!-- 挑战关的道具组在顶部栏里（关卡键右侧），不在面板内：
             堆框因此始终是加道具之前的原大小与原位置 -->
        <div class="pile-frame">
          <div class="pile-area" id="pileArea" aria-label="彩块堆"></div>
        </div>
        <div class="slotbar" id="pileSlotbar" aria-label="收集格">
          <div class="tray-layer" id="pileTrayLayer"></div>
        </div>
        <div class="win-banner" id="pileBanner" role="status">
          <div class="msg">
            <b class="display" id="pileBannerTitle">过关啦</b>
            <span id="pileBannerDetail"></span>
          </div>
          <button class="btn primary" id="pileAgainBtn" type="button">再来一次</button>
        </div>
      </section>

      <!-- ============ 记忆翻牌 ============ -->
      <section class="panel" id="panel-memory" aria-label="记忆翻牌">
        <div class="hud">
          <div class="stat"><div class="k">翻牌次数</div><div class="v" id="memMoves">0</div></div>
          <div class="stat"><div class="k">已配对</div><div class="v"><span id="memPairs">0</span><small> / 8 对</small></div></div>
          <div class="stat"><div class="k">用时</div><div class="v" id="memTime">00:00</div></div>
        </div>
        <div class="mem-holder">
          <div class="mem-grid" id="memGrid" aria-label="记忆翻牌棋盘"></div>
        </div>
        <div class="win-banner" id="memBanner" role="status">
          <div class="msg">
            <b class="display">配对完成</b>
            <span id="memDetail"></span>
          </div>
          <button class="btn primary" id="memAgainBtn" type="button">再来一局</button>
        </div>
      </section>
    </div>

    <!-- 装扮页：从设置扇形的装扮键进入的整页，替换原装扮托盘。
         顶部左 ← 返回、中间标题「装扮」；下面六张全宽卡片由 JS
         按六套装扮现建（卡里的块直接由 paintFace 按各套皮肤画，
         与棋盘上的一模一样） -->
    <div class="dress-page" id="dressPage" hidden>
      <div class="dress-inner">
        <div class="dress-head">
          <button class="dress-back" id="dressBackBtn" type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="dress-title display">装扮</div>
        </div>
        <div class="dress-list" id="dressList"></div>
      </div>
    </div>

    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <!-- 背景音乐：用户从 Pixabay 选的曲子，点「开始游戏」时起播、循环 -->
    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

    <script>
      (function(){
        "use strict";

        /* ================= expandable round-button trays ================= */
        /* 托盘只剩关卡一个（装扮已改成整页的装扮页，见后面的
           openDressPage），由顶栏的关卡键开关 */
        var trayPairs = [
          { btn:"btnLevels", tray:"trayLevels" }
        ];
        /* 关卡托盘是纯浮层：打开/关闭都不动棋盘框的上边距，
           棋盘大小位置纹丝不动，卡片直接盖在棋盘上方；
           syncTrayPad 只需把棋盘框上边距复位再重排一次 */
        function syncTrayPad(){
          var frame = document.getElementById("boardFrame");
          if(frame) frame.style.paddingTop = "";
          fitBoard();
        }
        function closeTrays(except){
          trayPairs.forEach(function(p){
            if(p.tray === except) return;
            document.getElementById(p.tray).classList.remove("open");
            document.getElementById(p.btn).setAttribute("aria-expanded","false");
          });
          requestAnimationFrame(syncTrayPad);
        }
        function toggleTray(btnId, trayId){
          var tray = document.getElementById(trayId);
          var btn = document.getElementById(btnId);
          var willOpen = !tray.classList.contains("open");
          closeTrays(trayId);
          tray.classList.toggle("open", willOpen);
          btn.setAttribute("aria-expanded", String(willOpen));
          requestAnimationFrame(syncTrayPad);
        }
        trayPairs.forEach(function(p){
          document.getElementById(p.btn).addEventListener("click", function(){
            toggleTray(p.btn, p.tray);
          });
        });

        /* ================= 设置扇形展开 ================= */
        /* 点齿轮：齿轮转半圈，音乐 / 音效 / 主页 / 装扮四键从齿轮
           位置一个接一个飞出（错峰、带轻微回弹），落在以齿轮为
           圆心、半径同为 86px 的圆弧上（角度 190° / 158° /
           126° / 94°，等距）；再点一次四键依次收回、齿轮转回。
           每键的位置只由它自己的 --fan-p 驱动（0 = 齿轮处、
           1 = 弧上落点），落点位移 --fx / --fy 写在 HTML 里，
           所以动画全程四键到圆心的距离都相等。
           收展用 WAAPI 逐键驱动：CSS 动画会把 .off 斜杠用的
           变换和 :active 缩放一起盖掉，逐键 animate() 只写
           --fan-p 这一个自定义属性，谁都不碰 */
        var settingsBtn = document.getElementById("settingsBtn");
        var settingsCard = document.getElementById("settingsCard");
        var fanBtns = Array.prototype.slice.call(settingsCard.querySelectorAll(".icon-btn"));
        var fanAnim = null;
        /* 扇层原点对准齿轮圆心：按实测位置算（齿轮键在 .wrap
           内的中心），窗口尺寸变化时重新对准 */
        function positionSettingsFan(){
          var wrap = settingsCard.parentElement;
          var wr = wrap.getBoundingClientRect();
          var br = settingsBtn.getBoundingClientRect();
          var cy = (br.top + br.height / 2) - wr.top;
          /* 音乐键转到 190° 后上移约 15px：两档屏宽下它的落点
             键顶都只差约 2px 就顶出 .wrap 上沿（宽屏齿轮 52px、
             四键 46px；窄屏齿轮 48px、四键 42px，差的都是这
             2px），原点一律下移 2px 垫住它——角度、半径、
             键大小都不动，键顶正好回到上沿之内 */
          cy += 2;
          settingsCard.style.left = ((br.left + br.width / 2) - wr.left) + "px";
          settingsCard.style.top = cy + "px";
        }
        window.addEventListener("resize", positionSettingsFan);
        positionSettingsFan();
        /* 一键的扇形动画：from / to 是 --fan-p 的起止值，delay
           是错峰毫秒数；回弹只出现在展开（飞出时轻微过冲再落定） */
        function fanRun(btn, from, to, delay){
          btn.style.setProperty("--fan-p", String(from));
          var anim = btn.animate(
            [{ "--fan-p": String(from) }, { "--fan-p": String(to) }],
            { duration: 340, delay: delay, easing: to > from ? "cubic-bezier(.34,1.45,.64,1)" : "cubic-bezier(.4,0,.5,1)", fill: "forwards" }
          );
          anim.onfinish = function(){ btn.style.setProperty("--fan-p", String(to)); };
          return anim;
        }
        function setSettings(open){
          var wasOpen = settingsCard.classList.contains("open");
          settingsBtn.classList.toggle("open", open);
          settingsBtn.setAttribute("aria-expanded", String(open));
          if(open === wasOpen) return;
          if(fanAnim){ fanAnim.forEach(function(a){ a.onfinish = null; a.cancel(); }); fanAnim = null; }
          if(open){
            positionSettingsFan();
            settingsCard.classList.add("open");
            fanAnim = fanBtns.map(function(btn, i){ return fanRun(btn, 0, 1, i * 70); });
          } else {
            /* 收回顺序与展开相反：最后飞出的装扮先回 */
            fanAnim = fanBtns.map(function(btn, i){ return fanRun(btn, 1, 0, (fanBtns.length - 1 - i) * 55); });
            settingsCard.classList.remove("open");
            settingsCard.classList.add("closing");
            setTimeout(function(){
              if(!settingsBtn.classList.contains("open")) settingsCard.classList.remove("closing");
            }, 340 + (fanBtns.length - 1) * 55 + 60);
          }
        }
        settingsBtn.addEventListener("click", function(){
          setSettings(!settingsBtn.classList.contains("open"));
        });
        /* 主页：重新盖上开始页，当前对局原样保留（不重开一局）；
           音乐保持当时的开/关状态、开着就继续放；圆圈动画重新
           转起来，再点 ▶ 走一遍幕布流程就回到原来的局面 */
        document.getElementById("homeBtn").addEventListener("click", function(){
          setSettings(false);
          closeTrays(null);
          var curtain = document.getElementById("curtain");
          curtain.classList.remove("cover", "lift", "gone");
          started = false;
          document.getElementById("startScreen").classList.remove("done");
          if(!reduced && !orbitTimer) orbitTimer = setInterval(orbitTick, 535);
        });
        /* 装扮：先收起扇形、齿轮转回，再打开整页装扮页 */
        document.getElementById("dressCardBtn").addEventListener("click", function(){
          setSettings(false);
          openDressPage();
        });

        /* ================= game switching =================
           玩法在开始页选（三个药丸键），这里只负责切面板；
           选中状态存在 homeGame 里，回主页时保留 */
        var curGame = "blocks";
        function showGame(name){
          curGame = name;
          document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("on"); });
          document.getElementById("panel-" + name).classList.add("on");
          /* 关卡键打开的是当前玩法的关卡；记忆翻牌没有关卡
             可选项，整颗键藏掉 */
          document.getElementById("btnLevels").hidden = name === "memory";
          renderLevelTray();
          /* 堆消的剩余计数 pill 只在堆消时露面；记忆翻牌第一次
             切过去才建牌（连同当前套的卡面卡背一起按需加载）。
             道具组住在顶栏里（不随面板一起藏），所以切玩法时要
             在这里同步：只有堆消且当前关是挑战关才露面；堆消内
             部换关时由 dealPile 再按关卡同步一次 */
          document.getElementById("pileLeftChip").hidden = name !== "pile";
          pileTools.hidden = !(name === "pile" && !!PILE_LEVELS[P.level].tools);
          if(name === "memory" && !memBuilt) buildMemory();
          if(name === "blocks") requestAnimationFrame(fitBoard);
          if(name === "pile") requestAnimationFrame(function(){
            if(!P.dealt) loadPileLevel(P.level);
            else layoutPile(false);
          });
        }
        /* ================= sound ================= */
        var soundOn = true, actx = null;
        function ac(){
          if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
          if(actx && actx.state === "suspended"){ actx.resume(); }
          return actx;
        }
        function tone(freq, t0, dur, type, vol){
          if(!soundOn) return;
          var c = ac(); if(!c) return;
          var o = c.createOscillator(), g = c.createGain();
          o.type = type || "sine"; o.frequency.value = freq;
          var start = c.currentTime + t0;
          g.gain.setValueAtTime(0.0001, start);
          /* 音效整体上调约四成半：所有音效都经 tone() 这一处，
             统一乘 1.45 并封顶 0.24 —— 最高的单音约 0.16，
             双音叠加也远低于破音线 */
          g.gain.exponentialRampToValueAtTime(Math.min(0.24, (vol || 0.12) * 1.45), start + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          o.connect(g); g.connect(c.destination);
          o.start(start); o.stop(start + dur + 0.05);
        }
        function sndSwap(){ tone(340, 0, 0.09, "triangle", 0.10); }
        function sndInsert(){ tone(520, 0, 0.07, "triangle", 0.09); tone(330, 0.06, 0.11, "triangle", 0.09); }
        function sndLand(){ tone(280, 0, 0.07, "triangle", 0.05); }
        function sndSelect(){ tone(520, 0, 0.06, "sine", 0.06); }
        function sndColumn(){ tone(660, 0, 0.12, "sine", 0.10); tone(880, 0.07, 0.14, "sine", 0.08); }
        function sndWin(){ [523,659,784,1046].forEach(function(f,i){ tone(f, i*0.11, 0.22, "triangle", 0.11); }); }
        function sndFlip(){ tone(440, 0, 0.06, "sine", 0.06); }
        function sndPair(){ tone(587, 0, 0.12, "sine", 0.10); tone(880, 0.08, 0.16, "sine", 0.09); }
        function sndBlocked(){ tone(180, 0, 0.08, "triangle", 0.07); }
        function sndLose(){ tone(330, 0, 0.16, "triangle", 0.10); tone(247, 0.14, 0.24, "triangle", 0.10); }

        var soundBtn = document.getElementById("soundBtn");
        soundBtn.addEventListener("click", function(){
          soundOn = !soundOn;
          soundBtn.setAttribute("aria-pressed", String(soundOn));
          soundBtn.setAttribute("aria-label", soundOn ? "声音开" : "声音关");
          soundBtn.classList.toggle("off", !soundOn);
          soundBtn.querySelectorAll(".wave").forEach(function(w){ w.style.display = soundOn ? "" : "none"; });
          if(soundOn) sndSelect();
        });

        /* ================= helpers ================= */
        function fmt(sec){
          var m = Math.floor(sec/60), s = sec%60;
          return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
        }
        function shuffleArr(a){
          for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
          return a;
        }
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        function confetti(){
          if(reduced) return;
          var box = document.getElementById("confetti");
          var colors = ["#8EA6BF","#C8A8B0","#A9BD9B","#B3A6CB","#93B8AC","#E2D59A","#C3A689"];
          for(var i=0;i<42;i++){
            var el = document.createElement("i");
            var sz = 6 + Math.random()*8;
            el.style.left = (Math.random()*100) + "vw";
            el.style.width = sz + "px";
            el.style.height = (sz*0.62) + "px";
            el.style.background = colors[i % colors.length];
            el.style.animationDuration = (1.6 + Math.random()*1.6) + "s";
            el.style.animationDelay = (Math.random()*0.5) + "s";
            box.appendChild(el);
            (function(node){ setTimeout(function(){ node.remove(); }, 4200); })(el);
          }
        }

        /* ================= block game ================= */
        var PALETTE = [
          { name:"藕粉",   c:"#C8A8B0" },
          { name:"奶茶棕", c:"#C3A689" },
          { name:"浅鹅黄", c:"#E2D59A" },
          { name:"抹茶绿", c:"#A9BD9B" },
          { name:"青瓷绿", c:"#93B8AC" },
          { name:"雾蓝",   c:"#8EA6BF" },
          { name:"丁香紫", c:"#B3A6CB" },
          { name:"雾灰",   c:"#9A9B97" }
        ];

           coloured area is inset by exactly the same 2px on all four

          if(!G.cols || !G.rows) return "skip";
